<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Football 27</title>
<style>
/* ============================================================
   PRIME FOOTBALL 27 — visual identity
   dark premium broadcast · gold main menu · teal-glass hub
   ============================================================ */
:root {
  --bg: #07090d; --panel: rgba(16, 22, 30, .78); --panel2: rgba(24, 32, 44, .9); --line: rgba(255, 255, 255, .09);
  --text: #eef2f6; --dim: #9aa6b4; --gold: #e8b631; --gold2: #f6d67a; --teal: #3fe0c5; --teal2: #1a8f86;
  --pink: #ff4fa3; --green: #3ddc84; --yellow: #ffd23f; --red: #ff4d5e; --blue: #3ea6ff;
  --font: "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
  --head: "Arial Black", "Segoe UI Black", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; user-select: none; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
#app { position: fixed; inset: 0; overflow: hidden; }
#bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
#screen { position: absolute; inset: 0; z-index: 2; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; animation: scrIn .45s var(--ease) both; }
.screen.out { animation: scrOut .25s ease both; pointer-events: none; }
@keyframes scrIn { from { opacity: 0; transform: translateX(26px) scale(.99); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes scrOut { to { opacity: 0; transform: translateX(-26px); filter: blur(3px); } }
.hidden { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .15); border-radius: 8px; } ::-webkit-scrollbar-track { background: transparent; }

/* ---------- generic controls ---------- */
[data-nav] { outline: none; cursor: pointer; }
.btn { background: rgba(255, 255, 255, .08); color: var(--text); border: 1px solid rgba(255, 255, 255, .14); padding: .62em 1.25em; border-radius: 10px; font-weight: 700; font-size: 14px; transition: all .15s; display: inline-flex; align-items: center; gap: .5em; white-space: nowrap; }
.btn:hover, .btn:focus { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .4); }
.btn:focus-visible, .btn:focus { box-shadow: 0 0 0 2px var(--teal), 0 0 18px rgba(63, 224, 197, .35); }
.btn.primary { background: linear-gradient(135deg, #f6f0ff, #d7e9ff 50%, #ffe1f3); color: #111; border-color: transparent; }
.btn.primary:focus, .btn.primary:hover { box-shadow: 0 0 0 2px #fff, 0 0 26px rgba(255, 255, 255, .45); }
.btn.gold { background: linear-gradient(135deg, var(--gold2), var(--gold)); color: #1a1406; border: none; }
.btn.danger { background: rgba(255, 77, 94, .18); border-color: rgba(255, 77, 94, .5); }
.btn.small { padding: .38em .8em; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn .key { display: inline-grid; place-items: center; width: 1.45em; height: 1.45em; border-radius: 50%; background: #111; color: #fff; font-size: .8em; font-weight: 900; }
.btn.primary .key { background: #111; }
input[type=text], input[type=number], select, textarea { background: rgba(0, 0, 0, .35); color: var(--text); border: 1px solid rgba(255, 255, 255, .16); border-radius: 8px; padding: .55em .7em; font-size: 14px; font-family: inherit; outline: none; }
input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(63, 224, 197, .25); }
select option { background: #111821; }
input[type=range] { accent-color: var(--teal); width: 100%; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.row { display: flex; gap: 10px; align-items: center; } .col { display: flex; flex-direction: column; gap: 10px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; } .spacer { flex: 1; }
.dim { color: var(--dim); } .good { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--yellow); }
.h1 { font-family: var(--head); font-weight: 900; font-size: 44px; letter-spacing: .01em; line-height: 1; text-transform: uppercase; margin: 0; }
.h2 { font-family: var(--head); font-weight: 900; font-size: 22px; text-transform: uppercase; margin: 0; letter-spacing: .02em; }
.h3 { font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; margin: 0; color: var(--dim); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); font-size: 12px; font-weight: 700; }
.bar { height: 7px; background: rgba(255, 255, 255, .1); border-radius: 9px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal2), var(--teal)); border-radius: 9px; transition: width .5s var(--ease); }
.bar.gold > i { background: linear-gradient(90deg, #b8861a, var(--gold2)); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.scroll { overflow: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; color: var(--dim); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #0f151d; }
.tbl td { padding: 8px; border-bottom: 1px solid rgba(255, 255, 255, .05); }
.tbl tr.me td { background: rgba(63, 224, 197, .1); }
.coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2b8, #e8b631 45%, #9c7210); vertical-align: -.12em; box-shadow: inset 0 0 0 1.5px rgba(0, 0, 0, .25); }
.pts { display: inline-block; width: 1em; height: 1em; transform: rotate(45deg) scale(.82); background: linear-gradient(135deg, #8ff6e6, #1bb59e); vertical-align: -.12em; border-radius: 2px; }

/* ---------- toasts & modals ---------- */
#toasts { position: fixed; top: 76px; right: 22px; z-index: 300; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: rgba(14, 20, 28, .95); border: 1px solid var(--line); border-left: 4px solid var(--blue); padding: 11px 16px; border-radius: 10px; font-size: 13.5px; max-width: 380px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: tin .35s var(--ease); }
.toast.good { border-left-color: var(--green); } .toast.bad { border-left-color: var(--red); }
.toast.out { opacity: 0; transform: translateX(30px); transition: all .4s; }
@keyframes tin { from { opacity: 0; transform: translateX(40px); } }
.modal-back { position: fixed; inset: 0; background: rgba(2, 4, 8, .72); z-index: 200; display: grid; place-items: center; animation: fadein .2s; backdrop-filter: blur(6px); }
.modal-back.out { opacity: 0; transition: opacity .18s; }
.modal { background: linear-gradient(160deg, #18212d, #0d1218); border: 1px solid rgba(255, 255, 255, .12); border-radius: 18px; padding: 24px 26px; min-width: 380px; max-width: min(560px, 92vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); animation: pop .3s var(--ease); }
.modal.wide { max-width: min(1100px, 95vw); width: 1100px; }
.modal h2 { margin: 0 0 14px; font-family: var(--head); font-weight: 900; font-size: 22px; text-transform: uppercase; }
.modal-body { overflow: auto; flex: 1; font-size: 14.5px; line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
@keyframes pop { from { transform: scale(.94) translateY(10px); opacity: 0; } }
@keyframes fadein { from { opacity: 0; } }

/* ---------- top bar & footer hints ---------- */
.topbar { display: flex; align-items: center; gap: 22px; padding: 20px 36px 0; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo27 { font-family: var(--head); font-weight: 900; font-size: 30px; font-style: italic; letter-spacing: -.02em; background: linear-gradient(180deg, #fff, #cfd6de); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo27 b { color: var(--gold); -webkit-text-fill-color: var(--gold); }
.cur { display: flex; align-items: center; gap: 16px; margin-left: auto; font-weight: 800; font-size: 15px; }
.cur > span { display: flex; align-items: center; gap: 6px; }
.cur .lvl { color: var(--dim); font-weight: 700; padding-left: 16px; border-left: 1px solid var(--line); }
.hints { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 22px; padding: 14px 36px; font-size: 13.5px; font-weight: 600; color: #cfd6de; z-index: 6; pointer-events: none; background: linear-gradient(0deg, rgba(0, 0, 0, .55), transparent); }
.hints .k { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px; background: rgba(255, 255, 255, .85); color: #111; font-size: 11px; font-weight: 900; margin-right: 6px; }
.hints .r { margin-left: auto; }

/* ---------- MAIN MENU (gold) ---------- */
.mm { background: linear-gradient(115deg, rgba(20, 15, 4, .95) 0%, rgba(78, 58, 14, .82) 22%, rgba(150, 116, 36, .55) 38%, rgba(60, 45, 12, .55) 55%, rgba(10, 8, 4, .9) 88%); }
.mm::before { content: ''; position: absolute; inset: 0; background: linear-gradient(60deg, transparent 30%, rgba(255, 220, 120, .12) 30.2%, rgba(255, 220, 120, .05) 46%, transparent 46.2%), linear-gradient(130deg, transparent 58%, rgba(0, 0, 0, .35) 58.2%); pointer-events: none; }
.mm-body { flex: 1; display: grid; grid-template-columns: 330px 1fr; padding: 34px 36px 70px; gap: 30px; min-height: 0; position: relative; }
.mm-list { display: flex; flex-direction: column; gap: 2px; justify-content: center; }
.mm-item { background: none; border: none; text-align: left; font-family: var(--head); font-weight: 900; text-transform: uppercase; font-size: 17px; color: rgba(255, 255, 255, .55); padding: 10px 14px; letter-spacing: .03em; transition: all .2s var(--ease); position: relative; border-radius: 8px; }
.mm-item:focus, .mm-item:hover { color: #fff; font-size: 27px; padding-left: 18px; text-shadow: 0 2px 20px rgba(255, 200, 80, .45); }
.mm-item:focus::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 4px; background: var(--gold); border-radius: 3px; box-shadow: 0 0 12px var(--gold); }
.mm-item .sub { display: block; font-family: var(--font); font-size: 0; color: var(--gold2); font-weight: 600; text-transform: none; letter-spacing: 0; transition: font-size .2s; }
.mm-item:focus .sub { font-size: 12.5px; }
.mm-feature { position: relative; display: flex; flex-direction: column; justify-content: center; }
.mm-feature .ft-title { font-family: var(--head); font-weight: 900; font-size: 34px; line-height: 1.02; text-transform: uppercase; max-width: 520px; }
.mm-feature .ft-sub { font-size: 15.5px; color: #f0e6c8; margin: 10px 0 22px; max-width: 470px; }
.mm-feature .ft-cards { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, auto); gap: 16px; }
.mm-feature .ft-cards .card { --cs: 13px; }
.mm-feature .ft-art { position: absolute; right: 30px; top: 50%; transform: translateY(-50%); }
.mm-feature .ft-body { position: relative; z-index: 2; animation: ftin .45s var(--ease); }
@keyframes ftin { from { opacity: 0; transform: translateY(14px); } }
.ft-dots { display: flex; gap: 6px; margin-top: 30px; } .ft-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .35); } .ft-dots i.on { background: #fff; }

/* ---------- UT HUB (teal glass) ---------- */
.hub { background: radial-gradient(1200px 600px at 70% 20%, rgba(40, 70, 80, .25), transparent), linear-gradient(180deg, rgba(5, 9, 13, .55), rgba(5, 8, 12, .85)); }
.hub-tabs { display: flex; align-items: center; gap: 4px; }
.hub-crest { display: grid; place-items: center; width: 54px; height: 60px; }
.hub-title { font-weight: 800; font-size: 26px; padding-right: 22px; margin-right: 6px; border-right: 1px solid rgba(255, 255, 255, .25); }
.tab { background: none; border: none; color: rgba(255, 255, 255, .55); font-size: 18px; font-weight: 600; padding: 8px 13px; position: relative; border-radius: 8px; transition: color .15s; }
.tab:hover, .tab:focus { color: #fff; }
.tab.on { color: #fff; font-weight: 800; }
.tab.on::after { content: ''; position: absolute; left: 14px; right: 14px; bottom: -2px; height: 3px; border-radius: 3px; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.tab .dot { position: absolute; top: 6px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 8px var(--teal); }
.lbrb { font-size: 10px; color: var(--dim); font-weight: 800; border: 1px solid rgba(255, 255, 255, .25); border-radius: 5px; padding: 1px 5px; margin: 0 4px; }
.hub-body { flex: 1; min-height: 0; padding: 14px 36px 64px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.page-title { font-family: var(--head); font-weight: 900; font-size: 40px; text-transform: uppercase; margin: 6px 0 16px; letter-spacing: .01em; }
.tiles { display: grid; gap: 18px; }
.tile { position: relative; border-radius: 14px; background: linear-gradient(170deg, rgba(36, 48, 60, .82), rgba(14, 20, 27, .9)); border: 1px solid rgba(255, 255, 255, .09); padding: 22px 24px; text-align: left; color: var(--text); overflow: hidden; transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; display: flex; flex-direction: column; }
.tile:focus, .tile:hover { transform: translateY(-3px) scale(1.012); border-color: rgba(160, 255, 236, .7); box-shadow: 0 0 0 1px rgba(160, 255, 236, .5), 0 14px 40px rgba(0, 0, 0, .45), 0 0 30px rgba(63, 224, 197, .18); }
.tile h3 { font-weight: 800; font-size: 26px; margin: 0 0 6px; line-height: 1.08; }
.tile .sub { color: var(--teal); font-weight: 700; font-size: 13.5px; line-height: 1.35; }
.tile .art { flex: 1; display: grid; place-items: center; min-height: 0; padding-top: 10px; }
.tile .tag { position: absolute; top: 14px; right: 14px; }
.tile.big h3 { font-size: 32px; }
.tile .glow { position: absolute; inset: auto -30% -60% -30%; height: 80%; background: radial-gradient(closest-side, rgba(63, 224, 197, .22), transparent); pointer-events: none; }

/* ---------- PLAYER CARDS ---------- */
.card { --cs: 10px; font-size: var(--cs); width: calc(var(--cs) * 12); height: calc(var(--cs) * 16.8); position: relative; flex: none; display: block; filter: drop-shadow(0 .5em .9em rgba(0, 0, 0, .55)); transition: transform .18s var(--ease), filter .18s; cursor: pointer; border: none; padding: 0; background: none; color: #1b1405; }
.card .cbg { position: absolute; inset: 0; clip-path: polygon(50% 0, 63% 3.2%, 80% 1.2%, 94% 6%, 100% 9%, 100% 84%, 91% 89.5%, 50% 100%, 9% 89.5%, 0 84%, 0 9%, 6% 6%, 20% 1.2%, 37% 3.2%); background: var(--cg); overflow: hidden; }
.card .cbg::before { content: ''; position: absolute; inset: 0; background: var(--cpat, none); opacity: .9; }
.card .cbg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .45) 47%, transparent 58%); transform: translateX(-120%); transition: transform 0s; }
.card:hover .cbg::after, .card:focus .cbg::after, .card.shine .cbg::after { transform: translateX(120%); transition: transform .8s ease; }
.card .ctrim { position: absolute; inset: .35em; clip-path: polygon(50% 0, 63% 3.2%, 80% 1.2%, 94% 6%, 100% 9%, 100% 84%, 91% 89.5%, 50% 100%, 9% 89.5%, 0 84%, 0 9%, 6% 6%, 20% 1.2%, 37% 3.2%); border: none; box-shadow: inset 0 0 0 .14em var(--ctrim, rgba(255, 255, 255, .35)); pointer-events: none; }
.card:focus, .card:hover { transform: translateY(-.35em) scale(1.03); filter: drop-shadow(0 0 .25em var(--cglow, rgba(255, 255, 255, .6))) drop-shadow(0 .8em 1.2em rgba(0, 0, 0, .6)); outline: none; }
.card .c-ovr { position: absolute; left: calc(var(--cs) * 1.3); top: calc(var(--cs) * 1.7); font-family: var(--head); font-weight: 900; font-size: calc(var(--cs) * 2.6); line-height: 1; letter-spacing: -.04em; color: var(--ctext, #1b1405); }
.card .c-pos { position: absolute; left: calc(var(--cs) * 1.42); top: calc(var(--cs) * 4.45); font-weight: 900; font-size: calc(var(--cs) * 1.1); line-height: 1; color: var(--ctext, #1b1405); letter-spacing: .02em; }
.card .c-meta { position: absolute; left: calc(var(--cs) * 1.3); top: calc(var(--cs) * 5.9); display: flex; flex-direction: column; gap: calc(var(--cs) * .3); align-items: center; width: calc(var(--cs) * 2.1); }
.card .c-meta svg { width: calc(var(--cs) * 1.85); height: calc(var(--cs) * 1.85); } .card .c-meta .flag { width: calc(var(--cs) * 1.85); height: calc(var(--cs) * 1.2); border-radius: 2px; }
.card .c-img { position: absolute; right: calc(var(--cs) * .6); top: calc(var(--cs) * 1.15); width: calc(var(--cs) * 7.6); height: calc(var(--cs) * 8); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent); }
.card .c-img svg { width: 100%; height: 100%; }
.card .c-name { position: absolute; left: 0; right: 0; top: calc(var(--cs) * 9.35); text-align: center; font-weight: 900; font-size: calc(var(--cs) * 1.15); line-height: 1.15; color: var(--ctext, #1b1405); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 calc(var(--cs) * 1.2); }
.card .c-stats { position: absolute; left: calc(var(--cs) * 1.1); right: calc(var(--cs) * 1.1); top: calc(var(--cs) * 11); display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; color: var(--ctext, #1b1405); }
.card .c-stats b { display: block; font-size: calc(var(--cs) * 1.08); font-weight: 900; line-height: 1.1; }
.card .c-stats span { display: block; font-size: calc(var(--cs) * .6); font-weight: 800; opacity: .78; line-height: 1.2; }
.card .c-foot { position: absolute; left: 0; right: 0; top: calc(var(--cs) * 13.55); display: flex; justify-content: center; gap: calc(var(--cs) * .5); align-items: center; }
.card .c-foot svg { width: calc(var(--cs) * 1.5); height: calc(var(--cs) * 1.5); } .card .c-foot .flag { width: calc(var(--cs) * 1.65); height: calc(var(--cs) * 1.1); border-radius: 2px; }
.card .c-type { position: absolute; top: calc(var(--cs) * .55); left: 0; right: 0; text-align: center; font-size: calc(var(--cs) * .6); font-weight: 900; letter-spacing: .14em; text-transform: uppercase; color: var(--ctext); opacity: .85; }
.card .c-badge { position: absolute; right: .3em; top: 6.2em; font-size: .9em; }
.card.mini { width: calc(var(--cs) * 7.4); height: calc(var(--cs) * 10.4); }
.card.mini .c-ovr { left: calc(var(--cs) * .75); top: calc(var(--cs) * 1.05); font-size: calc(var(--cs) * 1.95); }
.card.mini .c-pos { left: calc(var(--cs) * .85); top: calc(var(--cs) * 3.05); font-size: calc(var(--cs) * .82); }
.card.mini .c-img { right: calc(var(--cs) * .3); top: calc(var(--cs) * .6); width: calc(var(--cs) * 4.9); height: calc(var(--cs) * 5.6); }
.card.mini .c-name { top: calc(var(--cs) * 6.45); font-size: calc(var(--cs) * .92); padding: 0 calc(var(--cs) * .6); }
.card.mini .c-meta, .card.mini .c-stats, .card.mini .c-type { display: none; } .card.mini .c-foot { top: calc(var(--cs) * 8.0); gap: calc(var(--cs) * .3); }
.card.mini .c-foot svg { width: calc(var(--cs) * 1.15); height: calc(var(--cs) * 1.15); } .card.mini .c-foot .flag { width: calc(var(--cs) * 1.3); height: calc(var(--cs) * .85); }
.card.empty .cbg { background: linear-gradient(170deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03)); }
.card.empty .ctrim { box-shadow: inset 0 0 0 .12em rgba(255, 255, 255, .25); }
.card.empty .plus { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3em; color: rgba(255, 255, 255, .45); font-weight: 300; }
.card.empty .epos { position: absolute; bottom: 1.6em; left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, .7); font-weight: 900; font-size: 1.15em; }
/* rarity designs */
.r-bronze { --cg: linear-gradient(160deg, #e2b48c, #b07a4f 45%, #7d4f2c); --ctext: #2a1606; --ctrim: rgba(80, 40, 10, .4); }
.r-bronze-rare { --cg: linear-gradient(160deg, #f0c49c, #b8784a 40%, #6e3f1d); --cpat: repeating-linear-gradient(120deg, rgba(255, 255, 255, .12) 0 .4em, transparent .4em 1.6em); --ctext: #251202; --ctrim: rgba(255, 220, 190, .55); }
.r-silver { --cg: linear-gradient(160deg, #f1f3f6, #b9c1cb 45%, #8b95a3); --ctext: #1c232c; --ctrim: rgba(40, 50, 60, .3); }
.r-silver-rare { --cg: linear-gradient(160deg, #ffffff, #c4ccd6 40%, #7f8a99); --cpat: repeating-linear-gradient(120deg, rgba(255, 255, 255, .25) 0 .4em, transparent .4em 1.6em); --ctext: #141a21; --ctrim: rgba(255, 255, 255, .8); }
.r-gold { --cg: linear-gradient(160deg, #f8e4a6, #e0be62 45%, #b88f2e); --ctext: #2a1d02; --ctrim: rgba(90, 60, 0, .3); --cglow: #ffe28a; }

<script>
/* ---- core/util.js ---- */
/* ============================================================
   CORE / UTIL — seeded RNG, math & DOM helpers
   ============================================================ */
'use strict';

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const R = {
  rnd: Math.random,
  range(a, b) { return a + Math.random() * (b - a); },
  int(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  chance(p) { return Math.random() < p; },
  weighted(entries) { // [{w, v}]
    const tot = entries.reduce((s, e) => s + e.w, 0);
    let r = Math.random() * tot;
    for (const e of entries) { if ((r -= e.w) <= 0) return e.v; }
    return entries[entries.length - 1].v;
  },
  shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
};
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function fmtCoins(n) {
  n = Math.round(n);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
  if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '') + 'K';
  return n.toLocaleString('en-US');
}
function fmtFull(n) { return Math.round(n).toLocaleString('en-US'); }
function fmtTime(ms) {
  if (ms <= 0) return 'Expired';
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${sec}s`;
  return `${sec}s`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* DOM helpers */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* Toasts */
function toast(msg, kind = 'info') {
  let host = $('#toasts');
  if (!host) { host = h('<div id="toasts"></div>'); document.body.appendChild(host); }
  const el = h(`<div class="toast ${kind}">${msg}</div>`);
  host.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
}

/* Modal dialog (returns a promise). buttons: [{label, value, primary}] */
function modal({ title, body, buttons = [{ label: 'OK', value: true, primary: true }], wide = false, onOpen }) {
  return new Promise(resolve => {
    const el = h(`<div class="modal-back"><div class="modal ${wide ? 'wide' : ''}">
      ${title ? `<h2>${title}</h2>` : ''}<div class="modal-body"></div>
      <div class="modal-btns"></div></div></div>`);
    const bodyEl = $('.modal-body', el);
    if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
    const btns = $('.modal-btns', el);
    const close = v => { el.classList.add('out'); setTimeout(() => el.remove(), 180); Input.popLayer(layer); resolve(v); };
    buttons.forEach((b, i) => {
      const btn = h(`<button class="btn ${b.primary ? 'primary' : ''} ${b.danger ? 'danger' : ''}" data-nav>${b.label}</button>`);
      btn.onclick = () => { Audio2.sfx('select'); close(b.value); };
      btns.appendChild(btn);
    });
    document.body.appendChild(el);
    const layer = Input.pushLayer(el, () => close(buttons.find(b => b.cancel)?.value ?? null));
    if (onOpen) onOpen(el, close);
    Input.focusFirst(el);
  });
}

      stadium: { name: 'Phoenix Park', theme: 'gold', tifo: 'flames', seats: '#3a3f4d' },
      history: [{ t: Date.now(), text: 'Club founded' }]

const Save = {
  data: null,
  _t: null,
  load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (d && d.v === SAVE_VERSION) { this.data = this.migrate(d); return true; }
      }
    } catch (e) { console.warn('Save load failed', e); }
    this.data = null;
    return false;
  },
  migrate(d) {
    const base = newSave(d.profile?.name);
    // shallow fill of any missing keys so older saves keep working as systems are added
    for (const k in base) if (d[k] === undefined) d[k] = base[k];
    for (const k in base.settings) if (d.settings[k] === undefined) d.settings[k] = base.settings[k];
    for (const k in base.modes) if (!d.modes[k]) d.modes[k] = base.modes[k];
    for (const k in base.stats) if (d.stats[k] === undefined) d.stats[k] = base.stats[k];
    return d;
  },
  create(name) { this.data = newSave(name); this.now(); },
  // debounced autosave
  dirty() { clearTimeout(this._t); this._t = setTimeout(() => this.now(), 250); },
  now() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }
    catch (e) { console.warn('Save failed', e); toast('Save failed — storage unavailable', 'bad'); }
  },
  wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } this.data = null; },
  exportJSON() { return JSON.stringify(this.data); },
  importJSON(txt) {
    const d = JSON.parse(txt);
    if (!d || d.v !== SAVE_VERSION) throw new Error('Not a Prime Football 27 save');
    this.data = this.migrate(d); this.now();
  }
};
window.addEventListener('beforeunload', () => { if (Save.data) Save.now(); });

/* ============================================================
   CORE / AUDIO — fully synthesized music + SFX (WebAudio, no assets)
   ============================================================ */
const Audio2 = {
  ctx: null, master: null, musicGain: null, sfxGain: null, crowdGain: null,
  musicOn: false, _timer: null, _step: 0, _nextT: 0, noiseBuf: null, crowdSrc: null, crowdFilter: null,
  init() {
    if (this.ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
    } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.9; this.master.connect(c.destination);
    const comp = c.createDynamicsCompressor(); comp.connect(this.master);
    this.musicGain = c.createGain(); this.musicGain.connect(comp);
    this.sfxGain = c.createGain(); this.sfxGain.connect(comp);
    this.crowdGain = c.createGain(); this.crowdGain.gain.value = 0; this.crowdGain.connect(comp);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
    this.applyVolumes();
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  applyVolumes() {
    if (!this.ctx) return;
    const s = Save.data?.settings || defaultSettings();
    this.musicGain.gain.value = s.music * 0.32;
    this.sfxGain.gain.value = s.sfx * 0.7;
    this._crowdBase = s.crowd;
  },
  tone(freq, dur, { type = 'sine', vol = 0.3, attack = 0.005, when = 0, slide = 0, dest } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfxGain); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, { vol = 0.3, freq = 1200, q = 1, type = 'bandpass', when = 0, attack = 0.005, dest, slide = 0 } = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + when;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (slide) f.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfxGain); s.start(t); s.stop(t + dur + 0.05);
  },
  sfx(name) {
    if (!this.ctx) return;
    switch (name) {
      case 'move': this.tone(1800, 0.04, { type: 'triangle', vol: 0.07 }); break;
      case 'select': this.tone(880, 0.08, { type: 'triangle', vol: 0.18 }); this.tone(1320, 0.12, { type: 'triangle', vol: 0.14, when: 0.05 }); break;
      case 'back': this.tone(660, 0.1, { type: 'triangle', vol: 0.15, slide: 0.6 }); break;
      case 'error': this.tone(200, 0.18, { type: 'square', vol: 0.08 }); this.tone(150, 0.2, { type: 'square', vol: 0.08, when: 0.09 }); break;
      case 'coin': this.tone(1568, 0.08, { type: 'square', vol: 0.06 }); this.tone(2093, 0.18, { type: 'square', vol: 0.06, when: 0.07 }); break;
      case 'whoosh': this.noise(0.6, { vol: 0.35, freq: 400, slide: 8, q: 0.8 }); break;
      case 'tab': this.noise(0.12, { vol: 0.12, freq: 3000, q: 2 }); break;
      case 'boom': this.tone(70, 1.2, { type: 'sine', vol: 0.8, slide: 0.4 }); this.noise(0.8, { vol: 0.4, freq: 200, type: 'lowpass' }); break;
      case 'riser': this.noise(1.6, { vol: 0.25, freq: 300, slide: 12, attack: 1.4 }); this.tone(220, 1.6, { type: 'sawtooth', vol: 0.05, slide: 4, attack: 1.4 }); break;
      case 'reveal': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.5, { type: 'triangle', vol: 0.15, when: i * 0.07 })); break;
      case 'bigreveal': [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.9, { type: 'sawtooth', vol: 0.06, when: i * 0.06 })); this.sfx('boom'); break;
      case 'whistle': this.tone(2900, 0.35, { type: 'sine', vol: 0.18 }); this.tone(3050, 0.35, { type: 'sine', vol: 0.1 }); break;
      case 'whistle3': [0, 0.45, 0.9].forEach(w => { this.tone(2900, w === 0.9 ? 0.8 : 0.3, { type: 'sine', vol: 0.18, when: w }); }); break;
      case 'kick': this.noise(0.08, { vol: 0.35, freq: 900, q: 1.5 }); this.tone(120, 0.08, { vol: 0.3, slide: 0.5 }); break;
      case 'post': this.tone(1200, 0.5, { type: 'triangle', vol: 0.25 }); this.tone(1800, 0.4, { type: 'sine', vol: 0.1 }); break;
      case 'net': this.noise(0.4, { vol: 0.3, freq: 600, q: 0.6, type: 'lowpass' }); break;
      case 'tackle': this.noise(0.15, { vol: 0.3, freq: 300, q: 1 }); break;
      case 'goalcrowd': this.noise(3.5, { vol: 0.7, freq: 900, q: 0.5, attack: 0.15, dest: this.crowdGain2() }); break;
      case 'ooh': this.noise(1.4, { vol: 0.4, freq: 700, q: 1, attack: 0.2, slide: 0.6, dest: this.crowdGain2() }); break;
    }
  },
  crowdGain2() { return this.sfxGain; },
  /* ambient crowd bed for matches */
  crowdStart() {
    if (!this.ctx || this.crowdSrc) return;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 650; f.Q.value = 0.7;
    s.connect(f); f.connect(this.crowdGain); s.start();
    this.crowdSrc = s; this.crowdFilter = f;
    this.crowdLevel(0.25);
  },
  crowdLevel(x) { if (this.crowdGain && this.ctx) this.crowdGain.gain.setTargetAtTime(x * (this._crowdBase ?? 0.7) * 0.5, this.ctx.currentTime, 0.4); },
  crowdStop() { if (this.crowdSrc) { try { this.crowdSrc.stop(); } catch (e) { } this.crowdSrc = null; this.crowdLevel(0); } },

  /* procedural menu music: 4-chord synth pad + pulse bass + hats, 120bpm */
  musicStart() {
    if (!this.ctx || this.musicOn) return;
    this.musicOn = true; this._step = 0; this._nextT = this.ctx.currentTime + 0.1;
    const tick = () => {
      if (!this.musicOn) return;
      while (this._nextT < this.ctx.currentTime + 0.25) { this._schedule(this._step, this._nextT); this._step++; this._nextT += 0.125; }
      this._timer = setTimeout(tick, 60);
    };
    tick();
  },
  musicStop() { this.musicOn = false; clearTimeout(this._timer); },
  _schedule(step, t) {
    const c = this.ctx, when = t - c.currentTime;
    const chords = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 59], [55, 59, 62, 66]]; // Am9 Fmaj7 Cmaj7 G
    const bar = Math.floor(step / 16) % 4, s16 = step % 16;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const ch = chords[bar];
    if (s16 === 0) ch.forEach(n => this.tone(mtof(n), 2.0, { type: 'sawtooth', vol: 0.035, attack: 0.25, when, dest: this.musicGain }));
    if (s16 % 2 === 0) this.tone(mtof(ch[0] - 24), 0.2, { type: 'triangle', vol: s16 % 4 === 0 ? 0.35 : 0.2, when, dest: this.musicGain });
    if (s16 % 4 === 0) { this.tone(55, 0.25, { type: 'sine', vol: 0.5, slide: 0.5, when, dest: this.musicGain }); }
    if (s16 % 8 === 4) this.noise(0.18, { vol: 0.12, freq: 1800, q: 0.7, when, dest: this.musicGain });
    if (s16 % 2 === 1) this.noise(0.04, { vol: 0.05, freq: 8000, q: 1, type: 'highpass', when, dest: this.musicGain });
    const arp = [0, 2, 1, 3, 2, 1, 3, 0];
    if (s16 % 2 === 0 && bar % 2 === 1) this.tone(mtof(ch[arp[(s16 / 2) % 8]] + 12), 0.18, { type: 'square', vol: 0.025, when, dest: this.musicGain });
  }
};

/* ---- core/input.js ---- */
/* ============================================================
   CORE / INPUT — keyboard + gamepad, spatial menu navigation
   ============================================================ */
const Input = {
  keys: {}, pressed: {}, layers: [], mode: 'menu', // 'menu' | 'game'
  pad: null, padPrev: {}, padRepeat: {}, usingPad: false,
  onTab: null, // (dir) => void  (Q/E, LB/RB)

  init() {
    window.addEventListener('keydown', e => {
      Audio2.resume();
      const k = e.key.toLowerCase();
      if (!this.keys[k]) this.pressed[k] = true;
      this.keys[k] = true;
      this.usingPad = false;
      if (this.mode === 'menu') this.menuKey(k, e);
      else if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();
    });
    window.addEventListener('keyup', e => { this.keys[e.key.toLowerCase()] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    window.addEventListener('mousedown', () => Audio2.resume(), { capture: true });
    document.addEventListener('mouseover', e => {
      const t = e.target.closest('[data-nav]');
      if (t && this.mode === 'menu' && !t.disabled && document.activeElement !== t && this.inTopLayer(t)) { t.focus({ preventScroll: true }); }
    });
    document.addEventListener('focusin', e => { if (e.target.matches?.('[data-nav]')) Audio2.sfx('move'); });
    const loop = () => { this.pollPad(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  consume(k) { const p = this.pressed[k]; this.pressed[k] = false; return !!p; },
  clearPressed() { this.pressed = {}; },

  /* ---------- layers (screens / modals) ---------- */
  pushLayer(root, onBack) { const L = { root, onBack }; this.layers.push(L); return L; },
  popLayer(L) { const i = this.layers.indexOf(L); if (i >= 0) this.layers.splice(i, 1); const top = this.top(); if (top) this.focusFirst(top.root, true); },
  setBase(root, onBack) { this.layers = this.layers.filter(l => !l.base); const L = { root, onBack, base: true }; this.layers.unshift(L); return L; },
  top() { return this.layers[this.layers.length - 1]; },
  inTopLayer(el) { const t = this.top(); return !t || t.root.contains(el); },
  focusables(root) { return $$('[data-nav]', root).filter(el => !el.disabled && el.offsetParent !== null && !el.closest('.hidden')); },
  focusFirst(root, keepIfInside) {
    if (!root) return;
    if (keepIfInside && root.contains(document.activeElement) && document.activeElement.matches('[data-nav]')) return;
    const pref = $('[data-autofocus]', root);
    const f = pref && pref.offsetParent !== null ? pref : this.focusables(root)[0];
    if (f) f.focus({ preventScroll: false });
  },

  menuKey(k, e) {
    const tag = (document.activeElement?.tagName || '').toLowerCase();
    const typing = (tag === 'input' && !['range', 'checkbox', 'button'].includes(document.activeElement.type)) || tag === 'textarea';
    if (typing && k !== 'escape' && k !== 'enter') return;
    const dirs = { arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right' };
    if (dirs[k]) {
      if (tag === 'input' && document.activeElement.type === 'range' && (k === 'arrowleft' || k === 'arrowright')) return;
      if (tag === 'select') return;
      e.preventDefault(); this.navigate(dirs[k]);
    } else if (k === 'enter' || k === ' ') {
      if (tag === 'select' || (tag === 'input' && document.activeElement.type !== 'checkbox')) return;
      const a = document.activeElement;
      if (a && a.matches('[data-nav]')) { e.preventDefault(); a.click(); }
    } else if (k === 'escape' || k === 'backspace') {
      if (k === 'backspace' && typing) return;
      e.preventDefault(); this.back();
    } else if ((k === 'q' || k === 'e') && this.onTab && this.layers.length <= 1) {
      this.onTab(k === 'q' ? -1 : 1);
    }
  },
  back() { const t = this.top(); if (t && t.onBack) { Audio2.sfx('back'); t.onBack(); } },
  navigate(dir) {
    const t = this.top(); const root = t ? t.root : document.body;
    const list = this.focusables(root);
    if (!list.length) return;
    const cur = document.activeElement;
    if (!cur || !list.includes(cur)) { list[0].focus(); return; }
    const r = cur.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = null, bestScore = Infinity;
    for (const el of list) {
      if (el === cur) continue;
      const b = el.getBoundingClientRect(), x = b.left + b.width / 2, y = b.top + b.height / 2;
      const dx = x - cx, dy = y - cy;
      let main, cross;
      if (dir === 'up') { if (b.bottom > r.top + 4 && dy >= -2) continue; main = -dy; cross = Math.abs(dx); }
      if (dir === 'down') { if (b.top < r.bottom - 4 && dy <= 2) continue; main = dy; cross = Math.abs(dx); }
      if (dir === 'left') { if (b.right > r.left + 4 && dx >= -2) continue; main = -dx; cross = Math.abs(dy); }
      if (dir === 'right') { if (b.left < r.right - 4 && dx <= 2) continue; main = dx; cross = Math.abs(dy); }
      if (main <= 0) continue;
      const score = main + cross * 2.2;
      if (score < bestScore) { bestScore = score; best = el; }
    }
    if (best) { best.focus({ preventScroll: true }); best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' }); }
  },

  /* ---------- gamepad ---------- */
  pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let p = null; for (const g of pads) if (g && g.connected) { p = g; break; }
    this.pad = p;
    if (!p) return;
    const b = i => !!(p.buttons[i] && p.buttons[i].pressed);
    const ax = p.axes[0] || 0, ay = p.axes[1] || 0;
    const state = {
      a: b(0), b: b(1), x: b(2), y: b(3), lb: b(4), rb: b(5), lt: b(6), rt: b(7), back: b(8), start: b(9),
      up: b(12) || ay < -0.6, down: b(13) || ay > 0.6, left: b(14) || ax < -0.6, right: b(15) || ax > 0.6
    };
    const now = performance.now();
    const edge = k => state[k] && !this.padPrev[k];
    const rep = k => {
      if (!state[k]) { this.padRepeat[k] = 0; return false; }
      if (!this.padPrev[k]) { this.padRepeat[k] = now + 380; return true; }
      if (now > this.padRepeat[k]) { this.padRepeat[k] = now + 110; return true; }
      return false;
    };
    if (Object.values(state).some(v => v)) { this.usingPad = true; Audio2.resume(); }
    if (this.mode === 'menu') {
      for (const d of ['up', 'down', 'left', 'right']) if (rep(d)) {
        const a = document.activeElement;
        if (a && a.type === 'range' && (d === 'left' || d === 'right')) { a.value = +a.value + (d === 'left' ? -1 : 1) * (+a.step || 1); a.dispatchEvent(new Event('input', { bubbles: true })); }
        else this.navigate(d);
      }
      if (edge('a')) { const a = document.activeElement; if (a && a.matches('[data-nav]')) a.click(); else this.focusFirst(this.top()?.root); }
      if (edge('b')) this.back();
      if ((edge('lb') || edge('rb')) && this.onTab && this.layers.length <= 1) this.onTab(edge('lb') ? -1 : 1);
    }
    this.padState = state;
    this.padPrev = state;
  },
  padEdge(k) { return this.padState && this.padState[k] && !this._gamePrev?.[k]; }
};

/* ---------- flag rendering (SVG, original vector simplifications) ---------- */
function flagSVG(code, w = 24, h = 16) {
  const n = NATIONS[code];
  const W = 30, H = 20;
  const f = n ? n.flag : { t: 'solid', c: ['#888'] }, c = f.c;
  const stripes = (cols, vertical, weights) => { const ws = weights || cols.map(() => 1), tot = ws.reduce((a, b) => a + b, 0); let o = 0; return cols.map((col, i) => { const sz = (vertical ? W : H) * ws[i] / tot; const r = vertical ? `<rect x="${o}" y="0" width="${sz + 0.2}" height="${H}" fill="${col}"/>` : `<rect x="0" y="${o}" width="${W}" height="${sz + 0.2}" fill="${col}"/>`; o += sz; return r; }).join(''); };
  let inner = '';
  switch (f.t) {
    case 'v3': case 'v2': inner = stripes(c, true); break;
    case 'v3c': inner = stripes(c, true, [1, 2, 1]) + '<polygon points="15,6 17,11 15,15 13,11" fill="#ff0000"/>'; break;
    case 'v2p': inner = stripes(c, true, [2, 3]); break;
    case 'h2': case 'h3': case 'h5': inner = stripes(c, false); break;
    case 'h3w': inner = stripes(c, false, code === 'ESP' ? [1, 2, 1] : [2, 1, 1]); break;
    case 'cross': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><rect x="13" y="0" width="4" height="${H}" fill="${c[1]}"/><rect x="0" y="8" width="${W}" height="4" fill="${c[1]}"/>`; break;
    case 'swiss': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><rect x="13" y="4" width="4" height="12" fill="${c[1]}"/><rect x="9" y="8" width="12" height="4" fill="${c[1]}"/>`; break;
    case 'saltire': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><path d="M0 0 L30 20 M30 0 L0 20" stroke="${c[1]}" stroke-width="4"/>`; break;
    case 'nordic': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><rect x="8" y="0" width="6" height="${H}" fill="${c[1]}"/><rect x="0" y="7" width="${W}" height="6" fill="${c[1]}"/><rect x="9.5" y="0" width="3" height="${H}" fill="${c[2]}"/><rect x="0" y="8.5" width="${W}" height="3" fill="${c[2]}"/>`; break;
    case 'diamond': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><polygon points="15,2 28,10 15,18 2,10" fill="${c[1]}"/><circle cx="15" cy="10" r="4.5" fill="${c[2]}"/>`; break;
    case 'circle': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><circle cx="15" cy="10" r="6" fill="${c[1]}"/>`; break;
    case 'crescent': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><circle cx="12" cy="10" r="5.5" fill="${c[1]}"/><circle cx="13.6" cy="10" r="4.4" fill="${c[0]}"/><circle cx="19" cy="10" r="1.6" fill="${c[1]}"/>`; break;
    case 'star': inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/><polygon points="15,4 16.8,9.2 22,9.2 17.8,12.4 19.4,17.5 15,14.3 10.6,17.5 12.2,12.4 8,9.2 13.2,9.2" fill="none" stroke="${c[1]}" stroke-width="1.2"/>`; break;
    case 'czech': inner = stripes([c[0], c[1]], false) + `<polygon points="0,0 14,10 0,20" fill="${c[2]}"/>`; break;
    case 'usa': inner = stripes([c[0], c[1], c[0], c[1], c[0], c[1], c[0]], false) + `<rect width="13" height="11" fill="${c[2]}"/>`; break;
    case 'uae': inner = `<rect width="${W}" height="${H}" fill="${c[1]}"/><rect width="${W}" height="6.67" fill="${c[0]}"/><rect y="13.33" width="${W}" height="6.67" fill="${c[2]}"/><rect width="8" height="${H}" fill="${c[3]}"/>`; break;
    default: inner = `<rect width="${W}" height="${H}" fill="${c[0]}"/>`;
  }
  return `<svg class="flag" viewBox="0 0 ${W} ${H}" width="${w}" height="${h}" preserveAspectRatio="none">${inner}</svg>`;
}

  else if (style === 1) shape = `<circle cx="20" cy="20" r="17" fill="${a}" stroke="${b}" stroke-width="3"/><circle cx="20" cy="20" r="11" fill="none" stroke="${b}" stroke-width="1.5" opacity=".6"/>`;

  else shape = `<polygon points="20,2 36,10 36,30 20,38 4,30 4,10" fill="${a}" stroke="${b}" stroke-width="2.5"/><polygon points="20,8 30,13 30,27 20,32 10,27 10,13" fill="none" stroke="${b}" stroke-width="1.2" opacity=".7"/>`;
  const txt = style === 2 ? a : b;
  return `<svg viewBox="0 0 40 40" width="${size}" height="${size}">${shape}<text x="20" y="${style === 2 ? 30 : 26}" text-anchor="middle" font-size="13" font-weight="900" fill="${txt}" font-family="Arial Black,Arial" stroke="${style === 2 ? b : a}" stroke-width=".4">${esc(init)}</text></svg>`;
}

function leagueSVG(lg, size = 20) {

/* ============================================================
   DATA / PLAYERS — deterministic fictional player database
   Every card: name, face, nation, club, league, pos, ovr, 6 stats,
   foot, height, skill moves, weak foot, work rates, rarity/type.
   ============================================================ */
const PROFILE = { // stat offsets from overall: pac sho pas dri def phy
  ST: [4, 6, -6, 2, -40, 2], CF: [3, 4, 0, 5, -42, -4], LW: [8, 0, -2, 6, -45, -10], RW: [8, 0, -2, 6, -45, -10],

  CM: [-4, -4, 5, 2, -12, 0], CDM: [-6, -14, 0, -4, 4, 6],
  LB: [4, -30, -4, -2, 0, -2], RB: [4, -30, -4, -2, 0, -2], LWB: [6, -28, -2, 0, -4, -2], RWB: [6, -28, -2, 0, -4, -2],
  CB: [-8, -38, -14, -16, 6, 8], GK: [3, 2, -6, 3, -10, -25] // GK: div han kic ref spd pos
};
const STAT_KEYS = ['pac', 'sho', 'pas', 'dri', 'def', 'phy'];
const STAT_LABELS = ['PAC', 'SHO', 'PAS', 'DRI', 'DEF', 'PHY'];
const GK_LABELS = ['DIV', 'HAN', 'KIC', 'REF', 'SPD', 'POS'];

const CARD_TYPES = {
  base: { name: 'Base', order: 0 },
  totw: { name: 'Team of the Week', order: 3, color: '#111' },
  promo: { name: 'Nightfall', order: 4 },
  found: { name: 'Foundations', order: 2 },
  hero: { name: 'Hero', order: 5 },
  icon: { name: 'Icon', order: 6 }
};

const DB = { players: [], byId: {}, byClub: {}, ready: false };

function tierOf(ovr) { return ovr >= 76 ? 'gold' : ovr >= 71 ? 'silver' : 'bronze'; }
function rarityKey(p) { // visual design key
  if (p.type !== 'base') return p.type;
  return tierOf(p.ovr) + (p.rare ? '-rare' : '');
}
function rarityName(p) {
  if (p.type !== 'base') return CARD_TYPES[p.type].name;
  const t = tierOf(p.ovr); return (p.rare ? 'Rare ' : '') + t[0].toUpperCase() + t.slice(1);
}

function buildDatabase() {
  if (DB.ready) return;
  const rng = mulberry32(270027);
  const ri = (a, b) => Math.floor(a + rng() * (b - a + 1));
  const pk = arr => arr[Math.floor(rng() * arr.length)];
  const gauss = () => (rng() + rng() + rng() - 1.5) / 1.5;
  const usedNames = new Set();
  const natCodes = Object.keys(NATIONS);
  const genName = (nat) => {
    const N = NATIONS[nat];
    for (let i = 0; i < 30; i++) {
      const nm = `${pk(N.first)} ${pk(N.last)}`;
      if (!usedNames.has(nm)) { usedNames.add(nm); return nm; }
    }
    return `${pk(N.first)} ${pk(N.last)} ${ri(2, 9)}`;
  };
  const genStats = (pos, ovr) => {
    const prof = PROFILE[pos];
    return prof.map(o => clamp(Math.round(ovr + o + gauss() * 5), 18, 99));
  };
  const genFace = () => ({
    skin: ri(0, 7), hair: ri(0, 9), hairC: ri(0, 6), beard: rng() < 0.38 ? ri(1, 3) : 0, brow: ri(0, 2), seed: ri(0, 9999)
  });
  const make = (o) => {
    const p = Object.assign({
      foot: rng() < 0.74 ? 'R' : 'L', height: 0, sm: 2, wf: 3, wr: ['M', 'M'], rare: false, type: 'base', alt: []
    }, o);
    if (!p.height) p.height = p.pos === 'GK' ? ri(185, 199) : p.pos === 'CB' ? ri(181, 196) : ri(166, 191);
    if (['LB', 'LWB', 'LM', 'LW'].includes(p.pos) && rng() < 0.55) p.foot = 'L';
    const dri = p.stats[3];
    p.sm = p.pos === 'GK' ? 1 : clamp(Math.round((dri - 55) / 9 + rng() * 1.2), 1, 5);
    p.wf = clamp(ri(2, 4) + (rng() < 0.12 ? 1 : 0), 1, 5);
    const wl = ['L', 'M', 'H'];
    const g = POS_GROUP[p.pos];
    p.wr = [g === 'ATT' ? wl[ri(1, 2)] : g === 'DEF' ? wl[ri(0, 1)] : wl[ri(0, 2)], g === 'DEF' ? wl[ri(1, 2)] : g === 'ATT' ? wl[ri(0, 1)] : wl[ri(0, 2)]];
    p.alt = ALT_POS[p.pos].filter(() => rng() < 0.6).slice(0, 2);
    DB.players.push(p); DB.byId[p.id] = p;
    (DB.byClub[p.club] = DB.byClub[p.club] || []).push(p);
    return p;
  };

  // ---- real squads (top 5 leagues 2025/26); duplicates across clubs keep the first entry
  let n = 0;
  const seenNames = new Set();
  for (const code of REAL.order) {
    const cl = REAL.clubs[code];
    cl.roster.split('|').forEach(entry => {
      const [name, pos, nat, ovrS] = entry.split(';');
      if (!name || seenNames.has(name)) return;
      seenNames.add(name);
      const ovr = +ovrS;
      make({
        id: 'p' + (n++), name, nat: NATIONS[nat] ? nat : 'ENG', club: code, lg: cl.lg, pos, ovr, stats: genStats(pos, ovr),
        rare: rng() < (ovr >= 82 ? 0.85 : ovr >= 75 ? 0.5 : 0.3), face: genFace(), type: 'base', age: ri(18, 34)
      });
    });
  }
  const base = DB.players.slice();

  // ---- Team of the Week (in-forms of existing players)
  const pickSpecial = (count, minOvr, boost, type, prefix) => {
    const pool = base.filter(p => p.ovr >= minOvr && !p._special).sort(() => rng() - 0.5).slice(0, count);
    pool.forEach((src, i) => {
      src._special = true;
      const b = ri(boost[0], boost[1]);
      make({
        id: prefix + i, base: src.id, name: src.name, nat: src.nat, club: src.club, lg: src.lg, pos: src.pos, ovr: clamp(src.ovr + b, 1, 99),
        stats: src.stats.map(s => clamp(s + b + ri(0, 2), 1, 99)), rare: true, face: src.face, type, age: src.age, foot: src.foot, height: src.height
      });
    });
  };
  pickSpecial(24, 72, [3, 5], 'totw', 't');
  pickSpecial(18, 74, [6, 9], 'promo', 'n');
  pickSpecial(14, 64, [5, 8], 'found', 'f');

  // ---- Icons & Heroes (retired legends)
  REAL_ICONS.split('|').forEach((e, i) => {
    const [name, pos, nat, o] = e.split(';'); const ovr = +o;
    make({ id: 'i' + i, name, nat, club: 'ICN', lg: 'LEG', pos, ovr, stats: genStats(pos, ovr).map(s => clamp(s + 2, 1, 99)), rare: true, face: genFace(), type: 'icon', age: ri(40, 60) });
  });
  REAL_HEROES.split('|').forEach((e, i) => {
    const [name, pos, nat, o, lg] = e.split(';'); const ovr = +o;
    make({ id: 'h' + i, name, nat, club: 'HER', lg, pos, ovr, stats: genStats(pos, ovr).map(s => clamp(s + 1, 1, 99)), rare: true, face: genFace(), type: 'hero', age: ri(38, 50) });
  });
  DB.ready = true;
}

function P(id) { return DB.byId[id]; }

/* Market value estimate (coins) — exponential in rating, scaled by type/position */
function baseValue(p) {
  let v;
  if (p.ovr < 71) v = 150 + (p.ovr - 58) * 15;
  else if (p.ovr < 76) v = 350 + (p.ovr - 71) * 60 + (p.rare ? 150 : 0);
  else v = Math.round(750 * Math.pow(1.38, p.ovr - 76)) + (p.rare ? 400 : 0);
  const mult = { base: 1, totw: 2.2, found: 1.6, promo: 3, hero: 3.5, icon: 4.5 }[p.type] || 1;
  const posM = { ST: 1.2, LW: 1.15, RW: 1.15, CAM: 1.1, CB: 1.05, GK: 0.8, CF: 1.1 }[p.pos] || 1;
  return Math.max(150, Math.round(v * mult * posM / 50) * 50);
}
function quickSellValue(p) { return Math.max(50, Math.round(baseValue(p) * 0.08 / 10) * 10); }

/* ---- systems/squad.js ---- */
/* ============================================================
   SYSTEMS / FORMATIONS, CHEMISTRY, SQUADS, CLUB
   Coordinates: x 0..100 (left→right), y 0..100 (own goal=100 → attack=0)
   ============================================================ */
const FORMATIONS = {
  '4-3-3': [['GK', 50, 92], ['LB', 14, 72], ['CB', 37, 76], ['CB', 63, 76], ['RB', 86, 72], ['CM', 30, 52], ['CM', 50, 56], ['CM', 70, 52], ['LW', 18, 24], ['ST', 50, 18], ['RW', 82, 24]],
  '4-2-3-1': [['GK', 50, 92], ['LB', 14, 72], ['CB', 37, 76], ['CB', 63, 76], ['RB', 86, 72], ['CDM', 37, 58], ['CDM', 63, 58], ['LM', 16, 38], ['CAM', 50, 38], ['RM', 84, 38], ['ST', 50, 16]],
  '4-4-2': [['GK', 50, 92], ['LB', 14, 72], ['CB', 37, 76], ['CB', 63, 76], ['RB', 86, 72], ['LM', 14, 46], ['CM', 38, 50], ['CM', 62, 50], ['RM', 86, 46], ['ST', 38, 18], ['ST', 62, 18]],
  '4-1-2-1-2': [['GK', 50, 92], ['LB', 14, 72], ['CB', 37, 76], ['CB', 63, 76], ['RB', 86, 72], ['CDM', 50, 60], ['CM', 28, 48], ['CM', 72, 48], ['CAM', 50, 36], ['ST', 38, 17], ['ST', 62, 17]],
  '3-5-2': [['GK', 50, 92], ['CB', 28, 75], ['CB', 50, 78], ['CB', 72, 75], ['CDM', 38, 58], ['CDM', 62, 58], ['LM', 12, 44], ['CAM', 50, 38], ['RM', 88, 44], ['ST', 38, 17], ['ST', 62, 17]],
  '4-2-2-2': [['GK', 50, 92], ['LB', 14, 72], ['CB', 37, 76], ['CB', 63, 76], ['RB', 86, 72], ['CDM', 37, 58], ['CDM', 63, 58], ['CAM', 24, 36], ['CAM', 76, 36], ['ST', 38, 17], ['ST', 62, 17]],
  '5-3-2': [['GK', 50, 92], ['LWB', 10, 64], ['CB', 30, 76], ['CB', 50, 78], ['CB', 70, 76], ['RWB', 90, 64], ['CM', 30, 50], ['CM', 50, 54], ['CM', 70, 50], ['ST', 38, 18], ['ST', 62, 18]],
  '3-4-3': [['GK', 50, 92], ['CB', 28, 75], ['CB', 50, 78], ['CB', 72, 75], ['LM', 12, 50], ['CM', 38, 54], ['CM', 62, 54], ['RM', 88, 50], ['LW', 20, 24], ['ST', 50, 17], ['RW', 80, 24]]
};
const FORMATION_NAMES = Object.keys(FORMATIONS);

/* chemistry links between adjacent slots (nearest neighbours) */
const _linkCache = {};
function formationLinks(f) {
  if (_linkCache[f]) return _linkCache[f];
  const pos = FORMATIONS[f], links = new Set();
  pos.forEach((a, i) => {
    const near = pos.map((b, j) => ({ j, d: j === i ? 1e9 : Math.hypot(a[1] - b[1], (a[2] - b[2]) * 1.25) })).sort((x, y) => x.d - y.d);
    const k = a[0] === 'GK' ? 2 : 3;
    near.slice(0, k).forEach(nb => { if (nb.d < 45) links.add(i < nb.j ? `${i}-${nb.j}` : `${nb.j}-${i}`); });
  });
  return (_linkCache[f] = [...links].map(s => s.split('-').map(Number)));
}

function playerFitsPos(p, pos) { return p.pos === pos || (p.alt || []).includes(pos); }

/* Chemistry (0-3 per player, 33 max). Club/nation/league counts across the XI.
   Icons: +1 extra nation weight and count for every league. Heroes: double league weight.
   A player out of position gets 0 chemistry (but still contributes to others). */
function computeChemistry(formation, players /* array[11] of P or null */) {
  const club = {}, nat = {}, lg = {};
  const valid = players.map((p, i) => p ? { p, i } : null).filter(Boolean);
  valid.forEach(({ p }) => {
    if (p.club !== 'ICN' && p.club !== 'HER') club[p.club] = (club[p.club] || 0) + 1;
    nat[p.nat] = (nat[p.nat] || 0) + (p.type === 'icon' ? 2 : 1);
    if (p.type === 'hero') lg[p.lg] = (lg[p.lg] || 0) + 2;
    else if (p.type !== 'icon') lg[p.lg] = (lg[p.lg] || 0) + 1;
  });
  const iconCount = valid.filter(v => v.p.type === 'icon').length;
  const thr = (n, t) => n >= t[2] ? 3 : n >= t[1] ? 2 : n >= t[0] ? 1 : 0;
  const per = players.map((p, i) => {
    if (!p) return 0;
    const slotPos = FORMATIONS[formation][i][0];
    if (!playerFitsPos(p, slotPos)) return 0;
    if (p.type === 'icon' || p.type === 'hero') return 3;
    let c = 0;
    c += thr(club[p.club] || 0, [2, 5, 7]);
    c += thr(nat[p.nat] || 0, [2, 5, 8]);
    c += thr((lg[p.lg] || 0) + iconCount, [3, 5, 8]);
    return Math.min(3, c);
  });
  const links = formationLinks(formation).map(([a, b]) => {
    const A = players[a], B = players[b];
    if (!A || !B) return { a, b, q: 'none' };
    let s = 0;
    if (A.club === B.club && A.club !== 'ICN' && A.club !== 'HER') s += 2;
    if (A.nat === B.nat) s += 1;
    if (A.lg === B.lg || A.type === 'icon' || B.type === 'icon') s += 1;
    return { a, b, q: s >= 2 ? 'green' : s === 1 ? 'yellow' : 'red' };
  });
  return { per, total: per.reduce((x, y) => x + y, 0), links };
}

function squadRating(players) {
  const r = players.filter(Boolean).map(p => p.ovr);
  while (r.length < 11) r.push(0);
  const avg = r.reduce((a, b) => a + b, 0) / 11;
  const corr = r.reduce((s, x) => s + (x > avg ? x - avg : 0), 0);
  return Math.min(99, Math.floor((r.reduce((a, b) => a + b, 0) + corr) / 11));
}

/* team strength used by the match engine/simulation: attack/mid/def from slot positions */
function teamStrength(formation, players, chem) {
  const g = { ATT: [], MID: [], DEF: [], GK: [] };
  players.forEach((p, i) => {
    if (!p) return;
    const pos = FORMATIONS[formation][i][0];
    const c = chem ? chem.per[i] : 3;
    const eff = p.ovr - (playerFitsPos(p, pos) ? 0 : 6) + (c - 1.5) * 1.2;
    g[POS_GROUP[pos]].push(eff);
  });
  const av = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 40;
  return { att: av(g.ATT), mid: av(g.MID), def: av(g.DEF), gk: av(g.GK) };
}

/* ---------------- Club (owned items) ---------------- */
const Club = {
  items() { return Save.data.club.items; },
  get(uid) { return Save.data.club.items.find(i => i.uid === uid); },
  player(uid) { const it = this.get(uid); return it ? P(it.pid) : null; },
  add(pid, untr = true, source = '') {
    const it = { uid: uid(), pid, untr, at: Date.now(), src: source };
    Save.data.club.items.push(it); Save.dirty(); return it;
  },
  remove(uidv) {
    const d = Save.data;
    d.club.items = d.club.items.filter(i => i.uid !== uidv);
    // remove from all squads
    d.squads.forEach(s => {
      s.slots = s.slots.map(u => u === uidv ? null : u);
      s.subs = s.subs.map(u => u === uidv ? null : u);
      if (s.captain === uidv) s.captain = null;
    });
    Save.dirty();
  },
  ownsPid(pid) { return Save.data.club.items.some(i => i.pid === pid); },
  inSquadAnywhere(uidv) { return Save.data.squads.some(s => s.slots.includes(uidv) || s.subs.includes(uidv)); },
  inActiveSquad(uidv) { const s = Squads.active(); return s && (s.slots.includes(uidv) || s.subs.includes(uidv)); },
  duplicates() {
    const seen = {}, dups = [];
    for (const it of Save.data.club.items) { (seen[it.pid] = seen[it.pid] || []).push(it); }
    for (const k in seen) if (seen[k].length > 1) dups.push(...seen[k].slice(1));
    return dups;
  },
  inMarket(uidv) { return Save.data.market.mine.some(l => l.uid === uidv && l.status === 'active'); }
};

const Squads = {
  active() { return Save.data.squads[Save.data.activeSquad] || Save.data.squads[0]; },
  players(s) { return s.slots.map(u => u ? Club.player(u) : null); },
  create(name, formation = '4-3-3') {
    const s = { id: uid(), name, formation, slots: Array(11).fill(null), subs: Array(7).fill(null), captain: null };
    Save.data.squads.push(s); Save.dirty(); return s;
  },
  info(s) {
    const ps = this.players(s);
    const chem = computeChemistry(s.formation, ps);
    return { players: ps, chem, rating: squadRating(ps), filled: ps.filter(Boolean).length };
  },
  /* auto-build the best XI for formation from club (greedy by fit+rating, chem-aware second pass) */
  autoBuild(s, pool) {
    const items = (pool || Save.data.club.items).filter(it => !Club.inMarket(it.uid));
    const used = new Set(), usedPids = new Set();
    const slots = FORMATIONS[s.formation].map(f => f[0]);
    const order = slots.map((pos, i) => i).sort((a, b) => (slots[a] === 'GK' ? -1 : 0) - (slots[b] === 'GK' ? -1 : 0));
    const res = Array(11).fill(null);
    for (const i of order) {
      const pos = slots[i];
      let best = null, bs = -1;
      for (const it of items) {
        if (used.has(it.uid)) continue;
        const p = P(it.pid);
        if (usedPids.has(p.id)) continue;
        const sc = p.ovr + (p.pos === pos ? 12 : playerFitsPos(p, pos) ? 8 : (pos === 'GK' || p.pos === 'GK') ? -99 : -10);
        if (sc > bs) { bs = sc; best = it; }
      }
      if (best) { res[i] = best.uid; used.add(best.uid); usedPids.add(best.pid); }
    }
    s.slots = res;
    // subs: best remaining
    const rem = items.filter(it => !used.has(it.uid)).sort((a, b) => P(b.pid).ovr - P(a.pid).ovr);
    const subs = [];
    const gk = rem.find(it => P(it.pid).pos === 'GK');
    if (gk) subs.push(gk.uid);
    for (const it of rem) { if (subs.length >= 7) break; if (!subs.includes(it.uid)) subs.push(it.uid); }
    while (subs.length < 7) subs.push(null);
    s.subs = subs;
    // captain: highest rated
    const ps = s.slots.filter(Boolean);
    s.captain = ps.sort((a, b) => (Club.player(b)?.ovr || 0) - (Club.player(a)?.ovr || 0))[0] || null;
    Save.dirty();
  },
  isComplete(s) { return s.slots.every(Boolean); }
};

/* Build an AI opponent squad from the database. strength = target overall */
function buildAISquad(strength, opts = {}) {
  const formation = opts.formation || R.pick(FORMATION_NAMES);
  const slots = FORMATIONS[formation].map(f => f[0]);
  let pool = DB.players.filter(p => p.type === 'base' || (strength >= 84 && R.chance(0.3)));
  if (opts.league) pool = pool.filter(p => p.lg === opts.league);
  if (opts.club) pool = DB.byClub[opts.club].filter(p => p.type === 'base');
  const used = new Set();
  const players = slots.map(pos => {
    const cands = pool.filter(p => !used.has(p.id) && playerFitsPos(p, pos));
    let best = null, bd = 1e9;
    for (const c of R.shuffle(cands).slice(0, 220)) {
      const d = Math.abs(c.ovr - (strength + R.range(-3, 3)));
      if (d < bd) { bd = d; best = c; }
    }
    if (!best) best = R.pick(pool.filter(p => !used.has(p.id)));
    used.add(best.id); return best;
  });
  const subs = R.shuffle(pool.filter(p => !used.has(p.id) && Math.abs(p.ovr - strength) < 6)).slice(0, 7);
  return { formation, players, subs };
}

const Wallet = {
  get coins() { return Save.data.coins; },
  get points() { return Save.data.points; },
  can(cur, amt) { return (cur === 'coins' ? Save.data.coins : Save.data.points) >= amt; },
  add(cur, amt, desc, kind = 'reward') {
    if (!amt) return;
    if (cur === 'coins') Save.data.coins += amt; else Save.data.points += amt;
    this.log(kind, amt, cur, desc); UI.refreshCurrency(); if (amt > 0 && cur === 'coins') Audio2.sfx('coin');
  },
  spend(cur, amt, desc, kind = 'purchase') {
    amt = Math.round(amt);
    if (amt < 0 || !this.can(cur, amt)) { Audio2.sfx('error'); toast(`Not enough ${cur === 'coins' ? 'coins' : 'Prime Points'}`, 'bad'); return false; }
    if (cur === 'coins') Save.data.coins -= amt; else Save.data.points -= amt;
    this.log(kind, -amt, cur, desc); UI.refreshCurrency(); return true;
  },
  log(kind, amount, cur, desc) {
    Save.data.tx.unshift({ t: Date.now(), kind, amount, cur, desc });
    if (Save.data.tx.length > 300) Save.data.tx.length = 300;
    Save.dirty();
  }
};

const XP = {
  need(level) { return 800 + level * 350; },
  add(n) {

    while (pr.xp >= this.need(pr.level)) { pr.xp -= this.need(pr.level); pr.level++; ups++; }

};

const PACK_ORDER = ['bronze', 'silver', 'gold', 'premium', 'jumbo', 'rare', 'mega', 'ultimate', 'totwpack', 'nightfall', 'legends'];

const _tierPools = {};
function tierPool(tier) {
  if (_tierPools[tier]) return _tierPools[tier];
  let pool;
  if (tier === 'special') pool = DB.players.filter(p => ['totw', 'promo', 'hero', 'icon'].includes(p.type));
  else if (tier === 'legend') pool = DB.players.filter(p => p.type === 'hero' || p.type === 'icon');
  else if (['totw', 'promo', 'hero', 'icon', 'found'].includes(tier)) pool = DB.players.filter(p => p.type === tier);
  else if (tier === 'gold') pool = DB.players.filter(p => p.type === 'base' && tierOf(p.ovr) === 'gold'); // any gold (rare or not)
  else pool = DB.players.filter(p => p.type === 'base' && rarityKey(p) === tier);
  return (_tierPools[tier] = pool);
}
function rollFromTier(tier) {
  const pool = tierPool(tier);
  if (tier === 'legend') return R.chance(0.25) ? R.pick(pool.filter(p => p.type === 'icon')) : R.pick(pool.filter(p => p.type === 'hero'));
  // weight lower ratings more heavily (realistic pack odds)
  const min = Math.min(...pool.map(p => p.ovr));
  const k = tier.startsWith('gold') ? 3.2 : 6;
  return R.weighted(pool.map(p => ({ w: Math.exp(-(p.ovr - min) / k), v: p })));
}
/* odds table for transparency: probability per non-guaranteed slot + chance of ≥1 in pack */
function packOdds(id) {
  const pk = PACKS[id]; const tot = Object.values(pk.w).reduce((a, b) => a + b, 0);
  const free = pk.items - pk.guar.reduce((s, g) => s + g[1], 0);
  return Object.entries(pk.w).map(([t, w]) => {
    const p = w / tot;
    const guaranteed = pk.guar.filter(g => g[0] === t).reduce((s, g) => s + g[1], 0);
    const atLeast = guaranteed ? 1 : 1 - Math.pow(1 - p, free);
    return { tier: t, perSlot: p, atLeast };
  });
}
function generatePack(id) {
  const pk = PACKS[id], out = [];
  pk.guar.forEach(([t, n]) => { for (let i = 0; i < n; i++) out.push(rollFromTier(t)); });
  const ws = Object.entries(pk.w).map(([t, w]) => ({ w, v: t }));
  while (out.length < pk.items) out.push(rollFromTier(R.weighted(ws)));
  return out.sort((a, b) => cardValueScore(b) - cardValueScore(a));
}
function cardValueScore(p) { return p.ovr + (CARD_TYPES[p.type].order * 4) + (p.rare ? 1 : 0); }
const TIER_LABEL = { bronze: 'Bronze', 'bronze-rare': 'Rare Bronze', silver: 'Silver', 'silver-rare': 'Rare Silver', gold: 'Gold', 'gold-rare': 'Rare Gold', totw: 'Team of the Week', promo: 'Nightfall Promo', found: 'Foundations', hero: 'Hero', icon: 'Icon', special: 'Special card', legend: 'Hero/Icon' };

/* ---------------- TRANSFER MARKET ---------------- */
const MARKET_TAX = 0.05;
const Market = {
  demand(pid) { const d = Save.data.market.demand; return d[pid] ?? 1; },
  nudge(pid, f) { const d = Save.data.market.demand; d[pid] = clamp((d[pid] ?? 1) * f, 0.6, 1.8); },
  // global market cycle — prices oscillate slowly over real time (simulated "weekend league" demand etc.)
  cycle() { const t = Date.now() / 3.6e6; return 1 + 0.06 * Math.sin(t * 0.9) + 0.03 * Math.sin(t * 2.7); },
  value(p) { return Math.max(150, Math.round(baseValue(p) * this.demand(p.id) * this.cycle() / 50) * 50); },
  priceRange(p) { const v = this.value(p); return { min: Math.max(150, Math.round(v * 0.45 / 50) * 50), max: Math.round(v * 3 / 50) * 50 }; },
  makeListing(p) {
    const v = this.value(p), bin = Math.max(200, Math.round(v * R.range(0.92, 1.35) / 50) * 50);
    const start = Math.max(150, Math.round(bin * R.range(0.45, 0.8) / 50) * 50);
    const dur = R.pick([1, 2, 3, 5, 8, 15, 30, 60]) * 60000;
    const hasBid = R.chance(0.25);
    return { id: uid(), pid: p.id, start, bin, bid: hasBid ? start : 0, bidder: hasBid ? 'ai' : null, ends: Date.now() + dur * R.range(0.2, 1), seller: 'AI' };
  },
  search(f) {
    let pool = DB.players.filter(p => p.type !== 'found');
    if (f.name) { const q = f.name.toLowerCase(); pool = pool.filter(p => p.name.toLowerCase().includes(q)); }
    if (f.pos) pool = pool.filter(p => p.pos === f.pos);
    if (f.lg) pool = pool.filter(p => p.lg === f.lg);
    if (f.nat) pool = pool.filter(p => p.nat === f.nat);
    if (f.club) pool = pool.filter(p => p.club === f.club);
    if (f.rar) pool = pool.filter(p => f.rar === 'rare' ? p.rare : f.rar === 'special' ? p.type !== 'base' : rarityKey(p) === f.rar || (f.rar === 'gold' && tierOf(p.ovr) === 'gold' && p.type === 'base'));
    if (f.minOvr) pool = pool.filter(p => p.ovr >= f.minOvr);
    if (f.maxOvr) pool = pool.filter(p => p.ovr <= f.maxOvr);
    if (!pool.length) return [];
    // weighted toward common cards; specials are scarce
    const listings = [];
    const n = Math.min(24, Math.max(4, pool.length * 2));
    for (let i = 0; i < n; i++) {
      const p = R.pick(pool);
      if (p.type !== 'base' && R.chance(0.5) && pool.some(x => x.type === 'base')) continue;
      listings.push(this.makeListing(p));
    }
    let res = listings;
    if (f.maxBin) res = res.filter(l => l.bin <= f.maxBin);
    if (f.sort === 'bin-asc') res.sort((a, b) => a.bin - b.bin);
    else if (f.sort === 'bin-desc') res.sort((a, b) => b.bin - a.bin);
    else if (f.sort === 'ovr') res.sort((a, b) => P(b.pid).ovr - P(a.pid).ovr);
    else res.sort((a, b) => a.ends - b.ends);
    Save.data.market.listings = res; Save.dirty();
    return res;
  },
  buyNow(l) {
    const p = P(l.pid);
    if (l.ends < Date.now()) { toast('This auction has ended', 'bad'); return false; }
    if (!Wallet.spend('coins', l.bin, `Bought ${p.name} (${p.ovr})`, 'market')) return false;
    Club.add(p.id, false, 'market');
    this.nudge(p.id, 1.04);
    this.hist('buy', p, l.bin);
    Save.data.market.listings = Save.data.market.listings.filter(x => x.id !== l.id);
    Save.data.stats.bought++;
    Objectives.track('buy');
    return true;
  },
  minBid(l) { if (!l.bid) return l.start; return l.bid + (l.bid < 1000 ? 50 : l.bid < 10000 ? 100 : l.bid < 50000 ? 250 : 1000); },
  placeBid(l, amt) {
    const p = P(l.pid);
    if (l.ends < Date.now()) { toast('This auction has ended', 'bad'); return false; }
    if (amt < this.minBid(l)) { toast(`Minimum bid is ${fmtFull(this.minBid(l))}`, 'bad'); return false; }
    if (amt >= l.bin) return this.buyNow(l);
    // escrow coins
    if (!Wallet.spend('coins', amt, `Bid on ${p.name}`, 'bid')) return false;
    const prev = Save.data.market.bids.find(b => b.lid === l.id && b.status === 'winning');
    if (prev) { Wallet.add('coins', prev.amt, `Bid refund ${p.name}`, 'refund'); prev.status = 'replaced'; }
    l.bid = amt; l.bidder = 'me';
    Save.data.market.bids.unshift({ lid: l.id, pid: l.pid, amt, ends: l.ends, status: 'winning', listing: l });
    // a few seconds extension like real auctions
    if (l.ends - Date.now() < 30000) l.ends = Date.now() + 30000;
    Save.dirty(); return true;
  },
  listItem(uidv, start, bin, durMin) {
    const it = Club.get(uidv); if (!it) return false;
    const p = P(it.pid);
    if (it.untr) { toast('Untradeable items cannot be listed', 'bad'); return false; }
    if (Club.inMarket(uidv)) { toast('Already listed', 'bad'); return false; }
    const rg = this.priceRange(p);
    if (bin <= start) { toast('Buy Now must be higher than start price', 'bad'); return false; }
    if (start < rg.min || bin > rg.max) { toast(`Price range for this player: ${fmtFull(rg.min)} – ${fmtFull(rg.max)}`, 'bad'); return false; }
    // remove from squads while listed
    Save.data.squads.forEach(s => { s.slots = s.slots.map(u => u === uidv ? null : u); s.subs = s.subs.map(u => u === uidv ? null : u); });
    Save.data.market.mine.unshift({ id: uid(), uid: uidv, pid: p.id, start, bin, bid: 0, ends: Date.now() + durMin * 60000, status: 'active', listed: Date.now() });
    Save.dirty(); return true;
  },
  removeListing(id) {
    const l = Save.data.market.mine.find(x => x.id === id);
    if (!l) return;
    if (l.status === 'active' && l.bid) { toast('Cannot remove a listing that has bids', 'bad'); return false; }
    Save.data.market.mine = Save.data.market.mine.filter(x => x.id !== id);
    Save.dirty(); return true;
  },
  hist(kind, p, price) {
    Save.data.market.history.unshift({ t: Date.now(), kind, pid: p.id, price });
    if (Save.data.market.history.length > 150) Save.data.market.history.length = 150;
  },
  /* simulation tick — call regularly. Resolves auctions, simulates AI buyers/bidders */
  tick() {
    if (!Save.data) return;
    const now = Date.now(), m = Save.data.market;
    let changed = false;
    // my active listings: AI interest
    for (const l of m.mine) {
      if (l.status !== 'active') continue;
      const p = P(l.pid), v = this.value(p);
      const dt = Math.min(60, (now - (l._lt || l.listed)) / 1000); l._lt = now;
      // buy-now chance per second: higher when cheap
      const r = l.bin / v;
      const pBuy = r <= 0.95 ? 0.08 : r <= 1.1 ? 0.025 : r <= 1.3 ? 0.006 : 0.0008;
      if (Math.random() < 1 - Math.pow(1 - pBuy, dt)) { this.sell(l, l.bin); changed = true; continue; }
      // bidding
      const next = l.bid ? l.bid + Math.max(50, Math.round(l.bid * 0.05 / 50) * 50) : l.start;
      if (next < v * 0.98 && Math.random() < 1 - Math.pow(0.97, dt)) { l.bid = next; changed = true; }
      if (now >= l.ends) {
        if (l.bid) this.sell(l, l.bid); else { l.status = 'expired'; }
        changed = true;
      }
    }
    // my bids
    for (const b of m.bids) {
      if (b.status !== 'winning') continue;
      const l = b.listing, p = P(b.pid), v = this.value(p);
      const dt = Math.min(60, (now - (b._lt || now - 1000)) / 1000); b._lt = now;
      // AI outbid chance: high if our bid is well below value
      const r = b.amt / v, pOut = r < 0.7 ? 0.06 : r < 0.9 ? 0.025 : r < 1.0 ? 0.008 : 0.001;
      if (now < l.ends && Math.random() < 1 - Math.pow(1 - pOut, dt)) {
        b.status = 'outbid'; l.bid = this.minBid({ bid: b.amt }); l.bidder = 'ai';
        Wallet.add('coins', b.amt, `Outbid on ${p.name} — refund`, 'refund');
        toast(`Outbid on ${p.name}`, 'bad'); changed = true; continue;
      }
      if (now >= l.ends) {
        b.status = 'won'; Club.add(p.id, false, 'auction'); this.hist('buy', p, b.amt); this.nudge(p.id, 1.03);
        Save.data.stats.bought++; Objectives.track('buy');
        toast(`Won ${p.name} for ${fmtFull(b.amt)} coins!`, 'good'); changed = true;
      }
    }
    if (m.bids.length > 60) m.bids = m.bids.filter(b => b.status === 'winning').concat(m.bids.filter(b => b.status !== 'winning').slice(0, 40));
    if (changed) { Save.dirty(); UI.onMarketChange?.(); }
  },
  sell(l, price) {
    const p = P(l.pid);
    const net = Math.round(price * (1 - MARKET_TAX));
    l.status = 'sold'; l.sold = price;
    Club.remove(l.uid);
    Wallet.add('coins', net, `Sold ${p.name} for ${fmtFull(price)} (5% tax)`, 'sale');
    this.hist('sell', p, price); this.nudge(p.id, 0.97);
    Save.data.stats.sold++; Objectives.track('sell');
    toast(`${p.name} sold for ${fmtFull(price)}! +${fmtFull(net)} after tax`, 'good');
  }
};

function dayKey(t = Date.now()) { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function weekKey(t = Date.now()) { const d = new Date(t); const onejan = new Date(d.getFullYear(), 0, 1); return `${d.getFullYear()}-W${Math.ceil(((d - onejan) / 86400000 + onejan.getDay() + 1) / 7)}`; }
function msToReset(kind) {
  const now = new Date();
  if (kind === 'daily') { const t = new Date(now); t.setHours(24, 0, 0, 0); return t - now; }
  const t = new Date(now); t.setDate(t.getDate() + ((8 - t.getDay()) % 7 || 7)); t.setHours(0, 0, 0, 0); return t - now;
}

const Objectives = {
  periodKey(o) { return o.cat === 'daily' ? dayKey() : o.cat === 'weekly' ? weekKey() : o.cat === 'season' ? 'S1' : 'M'; },
  key(o) { return o.id + '@' + this.periodKey(o); },
  progress(o) { return Math.min(o.target, Save.data.objectives.progress[this.key(o)] || 0); },
  claimed(o) { return !!Save.data.objectives.claimed[this.key(o)]; },
  done(o) { return this.progress(o) >= o.target; },
  claimable() { return OBJECTIVES.filter(o => this.done(o) && !this.claimed(o)).length; },
  track(ev, n = 1) {
    if (!Save.data) return;
    let completed = [];
    for (const o of OBJECTIVES) {
      if (o.ev !== ev) continue;
      const k = this.key(o), before = Save.data.objectives.progress[k] || 0;
      if (before >= o.target) continue;
      Save.data.objectives.progress[k] = Math.min(o.target, before + n);
      if (Save.data.objectives.progress[k] >= o.target) completed.push(o);
    }
    completed.forEach(o => toast(`Objective complete: <b>${o.title}</b> — claim your reward`, 'good'));
    Save.dirty(); UI.refreshBadges?.();
  },
  claim(o) {
    if (!this.done(o) || this.claimed(o)) return false;
    Save.data.objectives.claimed[this.key(o)] = true;
    grantReward(o.reward, `Objective: ${o.title}`);
    Save.dirty(); return true;
  }
};

function rewardText(r) {

  if (r.tickets) parts.push(`${r.tickets} Champions Ticket`);
  if (r.xp) parts.push(`${fmtFull(r.xp)} XP`);
  return parts.join(' + ');
}
function grantReward(r, src) {
  if (r.coins) Wallet.add('coins', r.coins, src);

}

function sbcCheck(sbc, players /* array of P|null, length = size */, formation) {
  const ps = players.filter(Boolean);
  const chem = sbc.size === 11 ? computeChemistry(formation, players) : null;
  const rating = sbc.size === 11 ? squadRating(players) : (ps.length ? Math.floor(ps.reduce((a, p) => a + p.ovr, 0) / ps.length) : 0);
  const cnt = (f) => ps.filter(f).length;
  const maxBy = (key) => { const m = {}; ps.forEach(p => m[p[key]] = (m[p[key]] || 0) + 1); return Math.max(0, ...Object.values(m)); };
  const distinct = (key) => new Set(ps.map(p => p[key])).size;
  const res = [{ label: `Players: ${ps.length}/${sbc.size}`, ok: ps.length === sbc.size }];
  for (const r of sbc.reqs) {
    let label, ok;
    switch (r.t) {
      case 'tierAll': label = `All players: ${r.v[0].toUpperCase() + r.v.slice(1)}`; ok = ps.length > 0 && ps.every(p => tierOf(p.ovr) === r.v && p.type === 'base'); break;
      case 'tierMin': label = `Min. ${r.n} ${r.v[0].toUpperCase() + r.v.slice(1)} players`; ok = cnt(p => tierOf(p.ovr) === r.v) >= r.n; break;
      case 'rare': label = `Min. ${r.n} Rare players`; ok = cnt(p => p.rare) >= r.n; break;
      case 'rating': label = `Squad Rating: Min. ${r.v} (now ${rating})`; ok = rating >= r.v; break;
      case 'chem': label = `Total Chemistry: Min. ${r.v} (now ${chem ? chem.total : 0})`; ok = chem && chem.total >= r.v; break;
      case 'sameLeague': label = `Same League: ${r.n} players`; ok = maxBy('lg') >= r.n; break;
      case 'leagues': label = `Leagues: Min. ${r.n}`; ok = distinct('lg') >= r.n; break;
      case 'nations': label = `Nations: Min. ${r.n}`; ok = distinct('nat') >= r.n; break;
      case 'nat': label = `Same Nation: Min. ${r.n} players`; ok = maxBy('nat') >= r.n; break;
      case 'special': label = `Special cards (TOTW/Promo/Foundations): Min. ${r.n}`; ok = cnt(p => p.type !== 'base') >= r.n; break;
    }
    res.push({ label, ok });
  }
  return { reqs: res, ok: res.every(r => r.ok), rating, chem };
}
const SBC = {
  count(id) { return Save.data.sbc.done[id] || 0; },
  available(s) { return this.count(s.id) < s.repeat; },
  submit(sbc, uids, formation) {

};

  choices(pos, exclude) {
    const pool = DB.players.filter(p => playerFitsPos(p, pos) && p.ovr >= 76 && !exclude.has(p.id));
    const out = []; const seen = new Set(exclude);
    for (let i = 0; i < 200 && out.length < 5; i++) {
      const tier = R.weighted([{ w: 70, v: 'base' }, { w: 14, v: 'totw' }, { w: 8, v: 'promo' }, { w: 5, v: 'hero' }, { w: 3, v: 'icon' }]);
      const sub = pool.filter(p => (tier === 'base' ? p.type === 'base' : p.type === tier) && !seen.has(p.id));
      const pick = sub.length ? R.pick(sub) : R.pick(pool.filter(p => !seen.has(p.id)));
      if (pick && !seen.has(pick.id)) { out.push(pick); seen.add(pick.id); }
    }
    return out;
  }
