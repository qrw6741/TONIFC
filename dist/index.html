/* ---------- compare two cards ---------- */
function compareHTML(a, b) {

  return `<div class="row" style="gap:24px;align-items:flex-start">

      return `<div class="row" style="justify-content:space-between;font-weight:800;border-bottom:1px solid var(--line);padding:3px 0"><span>${x}</span><span class="dim" style="font-size:12px">${l}</span><span>${y} <span class="${d > 0 ? 'good' : d < 0 ? 'bad' : 'dim'}" style="font-size:12px">${d > 0 ? '▲' + d : d < 0 ? '▼' + -d : '='}</span></span></div>`;

function bestOwnedForPos(pos, excludeUid) {
  let best = null;
  for (const it of Save.data.club.items) { if (it.uid === excludeUid) continue; const p = P(it.pid); if (p.pos === pos && (!best || p.ovr > best.ovr)) best = p; }
  return best;
}

/* ---------- player picker modal (from club) ---------- */
function pickPlayer({ title = 'Select Player', pos = null, exclude = new Set(), allowUntr = true, pool = null, filter = null }) {
  return new Promise(resolve => {
    const items = (pool || Save.data.club.items).filter(it => !exclude.has(it.uid) && !Club.inMarket(it.uid) && (allowUntr || !it.untr) && (!filter || filter(it)));
    const body = h(`<div class="col" style="min-height:60vh">

      <select class="fpos" data-nav><option value="">All positions</option>${POSITIONS.map(x => `<option ${x === pos ? 'selected' : ''}>${x}</option>`).join('')}</select>
      <select class="fsort" data-nav><option value="fit">Best fit</option><option value="ovr">Rating</option><option value="new">Newest</option></select></div>
      <div class="list col scroll" style="gap:6px;max-height:58vh"></div></div>`);
    const list = $('.list', body);

      const q = $('.q', body).value.toLowerCase(), fp = $('.fpos', body).value, so = $('.fsort', body).value;
      let arr = items.map(it => ({ it, p: P(it.pid) })).filter(x => (!q || x.p.name.toLowerCase().includes(q)) && (!fp || playerFitsPos(x.p, fp)));
      if (so === 'fit' && pos) arr.sort((a, b) => ((b.p.pos === pos) * 20 + playerFitsPos(b.p, pos) * 10 + b.p.ovr) - ((a.p.pos === pos) * 20 + playerFitsPos(a.p, pos) * 10 + a.p.ovr));
      else if (so === 'new') arr.sort((a, b) => b.it.at - a.it.at);
      else arr.sort((a, b) => b.p.ovr - a.p.ovr);
      list.innerHTML = arr.length ? arr.slice(0, 150).map(x => playerRowHTML(x.p, `${x.it.untr ? '<span class="pill bad">UNTR</span>' : ''} ${Club.inActiveSquad(x.it.uid) ? '<span class="pill">IN SQUAD</span>' : ''}`, `data-uid="${x.it.uid}"`)).join('') : '<div class="dim" style="padding:20px">No players match. Open packs or buy from the Transfer Market.</div>';
      $$('.prow', list).forEach(b => b.onclick = () => { Audio2.sfx('select'); close(b.dataset.uid); });
    };
    let close;

    modal({ title, body, wide: true, buttons: [{ label: 'Cancel', value: null, cancel: true }], onOpen: (el, c) => { close = c; render(); } }).then(resolve);

/* ---- ui/background.js ---- */
/* ============================================================

const BG = {
  cv: null, ctx: null, mode: 'menu', t: 0, running: false, players: [], ball: null, parts: [], crowd: null, w: 0, h: 0,
  init() {
    this.cv = $('#bg'); this.ctx = this.cv.getContext('2d');

    addEventListener('resize', rs); rs();
    // background players
    const kits = [['#e8b631', '#14161c'], ['#f2f2f2', '#2a6fdb']];
    for (let i = 0; i < 12; i++) this.players.push({ x: R.range(20, 85), z: R.range(8, 60), vx: 0, vz: 0, team: i % 2, kit: kits[i % 2], ph: R.range(0, 6), tx: 0, tz: 0, retarget: 0 });

    this.running = true;
    let last = performance.now();
    const loop = (now) => {
      const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
      if (this.mode !== 'off') { this.t += dt; this.update(dt); this.draw(); }
      requestAnimationFrame(loop);

  set(mode) { this.mode = mode; this.cv.style.display = mode === 'off' ? 'none' : 'block'; },
  update(dt) {

    if (owner) { b.x = lerp(b.x, owner.x + 0.9, 0.3); b.z = lerp(b.z, owner.z, 0.3); }
    else { b.x += b.vx * dt; b.z += b.vz * dt; b.vx *= 0.985; b.vz *= 0.985; }
    if (owner && Math.random() < dt * 0.6) { // pass
      const mates = ps.filter((p, i) => p.team === owner.team && p !== owner);
      const tgt = R.pick(mates); const d = Math.hypot(tgt.x - b.x, tgt.z - b.z) || 1;
      b.vx = (tgt.x - b.x) / d * 22; b.vz = (tgt.z - b.z) / d * 22; b.owner = -1;
    }
    ps.forEach((p, i) => {
      p.retarget -= dt;
      if (b.owner === -1) { // chase ball
        const d = Math.hypot(b.x - p.x, b.z - p.z);
        if (d < 1.4) { b.owner = i; }
      }
      if (p.retarget <= 0) { p.tx = clamp(b.x + R.range(-22, 22), 6, 99); p.tz = clamp(b.z + R.range(-16, 16), 4, 64); p.retarget = R.range(1, 3); }
      const tx = (b.owner === -1 && Math.hypot(b.x - p.x, b.z - p.z) < 12) ? b.x : (i === b.owner ? p.x + (p.team ? -6 : 6) : p.tx);
      const tz = (b.owner === -1 && Math.hypot(b.x - p.x, b.z - p.z) < 12) ? b.z : (i === b.owner ? p.z + Math.sin(this.t + i) * 4 : p.tz);
      const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz) || 1;

  },
  proj(x, z, y = 0) {

  draw() {

    const ag = c.createLinearGradient(a0.x, 0, a1.x, 0);
    const sh = (this.t * 0.15) % 1;
    ag.addColorStop(0, '#0f2b3d'); ag.addColorStop(sh, '#e8b631'); ag.addColorStop(Math.min(1, sh + 0.05), '#0f2b3d'); ag.addColorStop(1, '#0f2b3d');
    c.fillStyle = ag; c.beginPath(); c.moveTo(a0.x, a0.y); c.lineTo(a1.x, a1.y); c.lineTo(a2.x, a2.y); c.lineTo(a3.x, a3.y); c.fill();
    // pitch with stripes
    for (let i = 0; i < 14; i++) {

    }

    const line = (pts) => { c.beginPath(); pts.forEach((p, i) => { const q = this.proj(p[0], p[1]); i ? c.lineTo(q.x, q.y) : c.moveTo(q.x, q.y); }); c.stroke(); };
    line([[0, 0], [105, 0], [105, 68], [0, 68], [0, 0]]); line([[52.5, 0], [52.5, 68]]);
    line([[0, 13.8], [16.5, 13.8], [16.5, 54.2], [0, 54.2]]); line([[105, 13.8], [88.5, 13.8], [88.5, 54.2], [105, 54.2]]);
    const circ = []; for (let a = 0; a <= 6.3; a += 0.2) circ.push([52.5 + Math.cos(a) * 9.15, 34 + Math.sin(a) * 9.15]); line(circ);
    // goals
    [0, 105].forEach(gx => {
      const a = this.proj(gx, 30.3), b = this.proj(gx, 37.7), at = this.proj(gx, 30.3, 2.44), bt = this.proj(gx, 37.7, 2.44);
      c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(at.x, at.y); c.lineTo(bt.x, bt.y); c.lineTo(b.x, b.y); c.stroke();
    });
    // players (sorted by depth)
    const ents = this.players.map((p, i) => ({ p, i, z: p.z })).sort((a, b) => b.z - a.z);
    for (const { p } of ents) this.drawRunner(p);

    c.fillStyle = '#fff'; c.beginPath(); c.arc(bp.x, bp.y, Math.max(1.5, bp.s * 0.22), 0, 7); c.fill();
    // floodlights + glare
    [[-8, 74, 30], [113, 74, 30], [20, 76, 34], [85, 76, 34]].forEach(([x, z, y], i) => {

      rg.addColorStop(0, 'rgba(255,255,240,.9)'); rg.addColorStop(0.05, 'rgba(255,250,220,.45)'); rg.addColorStop(0.3, 'rgba(255,240,200,.08)'); rg.addColorStop(1, 'rgba(0,0,0,0)');

    c.beginPath(); c.moveTo(base.x - w * 0.5, base.y - hgt * 0.8); c.lineTo(base.x - w * 0.6 - sw * w * 0.3, base.y - hgt * 0.6); c.moveTo(base.x + w * 0.5, base.y - hgt * 0.8); c.lineTo(base.x + w * 0.6 + sw * w * 0.3, base.y - hgt * 0.6); c.stroke();
    // head
    c.fillStyle = '#c48a5c'; c.beginPath(); c.arc(base.x, base.y - hgt * 0.93, w * 0.32, 0, 7); c.fill();
  },
  drawHub() {
    const c = this.ctx, W = this.w, H = this.h, t = this.t;
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0c1116'); g.addColorStop(0.55, '#121a20'); g.addColorStop(1, '#06090c');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // ceiling slats in perspective
    const vpX = W * 0.55 + Math.sin(t * 0.08) * 40, vpY = H * 0.42;
    c.strokeStyle = 'rgba(255,255,255,.05)'; c.lineWidth = 2;
    for (let i = -20; i <= 20; i++) { c.beginPath(); c.moveTo(vpX + i * 8, vpY - 70); c.lineTo(vpX + i * 160, -20); c.stroke(); }
    // light strips
    for (let i = 0; i < 5; i++) {
      const y = H * 0.08 + i * 26, w = W * (0.5 - i * 0.06);
      const lg = c.createLinearGradient(vpX - w / 2, 0, vpX + w / 2, 0);
      lg.addColorStop(0, 'rgba(160,255,236,0)'); lg.addColorStop(0.5, `rgba(200,255,245,${0.18 - i * 0.025})`); lg.addColorStop(1, 'rgba(160,255,236,0)');
      c.fillStyle = lg; c.fillRect(vpX - w / 2, y, w, 3);
    }
    // lockers silhouettes
    c.fillStyle = 'rgba(255,255,255,.025)';
    for (let i = 0; i < 9; i++) { const x = vpX - 380 + i * 95; c.fillRect(x, vpY - 40, 70, 210); }
    // floor reflection
    const fg = c.createLinearGradient(0, vpY + 170, 0, H);
    fg.addColorStop(0, 'rgba(63,224,197,.06)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = fg; c.fillRect(0, vpY + 170, W, H);
    // dotted side panels like broadcast set
    c.fillStyle = 'rgba(63,224,197,.12)';
    for (let y = 0; y < H; y += 12) for (let x = 0; x < 70; x += 12) { if ((x + y) % 24 === 0) { c.beginPath(); c.arc(x + 6, y + 6, 1.8, 0, 7); c.fill(); c.beginPath(); c.arc(W - x - 6, y + 6, 1.8, 0, 7); c.fill(); } }
    // drifting particles
    c.globalCompositeOperation = 'lighter';
    for (const pt of this.parts) { pt.y -= pt.v * 0.15; if (pt.y < 0) { pt.y = 1; pt.x = Math.random(); } c.fillStyle = `rgba(120,255,230,${pt.a * 0.25})`; c.beginPath(); c.arc(pt.x * W, pt.y * H, pt.s, 0, 7); c.fill(); }
    c.globalCompositeOperation = 'source-over';
  }
};

const SCREENS = {};
const HUB_TABS = [['home', 'Home'], ['objectives', 'Objectives'], ['play', 'Play'], ['club', 'Club'], ['sbc', 'SBC'], ['transfers', 'Transfers'], ['store', 'Store']];

const UI = {
  cur: null, curName: '', params: null, stack: [], timers: [],
  go(name, params = {}, { push = true, replace = false } = {}) {
    const S = SCREENS[name]; if (!S) { console.error('No screen', name); return; }
    this.timers.forEach(clearInterval); this.timers = [];
    if (this.cur) {
      if (push && !replace && this.curName) this.stack.push({ name: this.curName, params: this.params });
      const old = this.cur; old.classList.add('out'); setTimeout(() => old.remove(), 260);
    }
    if (!push) { /* going back: stack already popped */ }
    this.curName = name; this.params = params;
    BG.set(S.bg || 'hub');
    const el = S.render(params);
    el.classList.add('screen');
    $('#screen').appendChild(el);
    this.cur = el;
    Input.mode = 'menu';
    Input.onTab = S.hub ? (d) => { const i = HUB_TABS.findIndex(t => t[0] === name); if (i < 0) return; const n = HUB_TABS[(i + d + HUB_TABS.length) % HUB_TABS.length][0]; Audio2.sfx('tab'); this.go(n, {}, { replace: true, push: false }); } : null;
    Input.setBase(el, () => S.back ? S.back() : this.back());
    requestAnimationFrame(() => Input.focusFirst(el));
    if (S.after) S.after(el, params);
    if (!Audio2.musicOn && Audio2.ctx && !S.noMusic) Audio2.musicStart();
  },
  back() {
    const prev = this.stack.pop();
    if (prev) this.go(prev.name, prev.params, { push: false });
  },
  reset(name, params) { this.stack = []; this.go(name, params, { push: false }); },
  rerender() { const n = this.curName, p = this.params; const st = this.stack.slice(); this.go(n, p, { push: false }); this.stack = st; },
  every(ms, fn) { const t = setInterval(fn, ms); this.timers.push(t); return t; },
  refreshCurrency() {
    $$('[data-coins]').forEach(e => e.textContent = fmtFull(Save.data.coins));
    $$('[data-points]').forEach(e => e.textContent = fmtFull(Save.data.points));
    $$('[data-level]').forEach(e => e.textContent = 'LVL ' + Save.data.profile.level);
  },
  refreshBadges() { const n = Objectives.claimable(); $$('[data-objdot]').forEach(e => e.classList.toggle('hidden', !n)); },
  onMarketChange: null
};

function grantStarter() {
  // starter squad: a balanced mix of bronze/silver/gold (untradeable)
  const need = { GK: 2, CB: 4, LB: 2, RB: 2, CDM: 2, CM: 3, CAM: 1, LM: 1, RM: 1, LW: 1, RW: 1, ST: 3 };
  const base = DB.players.filter(p => p.type === 'base');
  const lg = R.pick(['ENG1', 'ESP1', 'ITA1', 'GER1', 'FRA1']);
  for (const pos in need) {
    for (let i = 0; i < need[pos]; i++) {
      const target = i === 0 ? R.int(73, 77) : R.int(67, 73);
      const pool = base.filter(p => p.pos === pos && Math.abs(p.ovr - target) <= 3 && (i === 0 ? p.lg === lg : true) && !Club.ownsPid(p.id));
      const p = pool.length ? R.pick(pool) : R.pick(base.filter(x => x.pos === pos));
      Club.add(p.id, true, 'starter');
    }
  }
  const s = Squads.create('Starter XI', '4-3-3');
  Squads.autoBuild(s);
  Save.data.unopened.push('premium');
  Save.data.profile.history.unshift({ t: Date.now(), text: `${Save.data.profile.clubName} joined Ultimate XI` });
}

function clubTeam(code, { formation } = {}) {
  const sq = buildAISquad(0, { club: code, formation: formation || '4-3-3' });
  // pick best XI from club
  const s = { formation: sq.formation, players: [], subs: [] };
  const roster = DB.byClub[code].filter(p => p.type === 'base').sort((a, b) => b.ovr - a.ovr);
  const used = new Set();
  FORMATIONS[s.formation].forEach(([pos]) => {
    let p = roster.find(x => !used.has(x.id) && x.pos === pos) || roster.find(x => !used.has(x.id) && playerFitsPos(x, pos)) || roster.find(x => !used.has(x.id) && x.pos !== 'GK');
    used.add(p.id); s.players.push(p);
  });
  s.subs = roster.filter(x => !used.has(x.id)).slice(0, 7);
  const cl = CLUBS[code];
  return { name: cl.name, short: code, kit: { c1: cl.c[0], c2: cl.c[1] }, formation: s.formation, players: s.players, subs: s.subs, crest: code };
}

/* ---------------- Career (simplified manager career) ---------------- */
function roundRobin(teams) {
  const t = teams.slice(), n = t.length, rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const rd = [];
    for (let i = 0; i < n / 2; i++) { const a = t[i], b = t[n - 1 - i]; rd.push(r % 2 ? [b, a] : [a, b]); }
    rounds.push(rd); t.splice(1, 0, t.pop());
  }
  return rounds.concat(rounds.map(rd => rd.map(([a, b]) => [b, a])));
}
function simScore(aStr, bStr, homeAdv = 1.5) {
  const diff = (aStr + homeAdv - bStr) / 10;
  const la = clamp(1.35 + diff * 0.9, 0.2, 4), lb = clamp(1.15 - diff * 0.9, 0.2, 4);
  const pois = l => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
  return [pois(la), pois(lb)];
}

  },

};

async function renameSquad(s) {
  const body = h(`<div><input type="text" value="${esc(s.name)}" maxlength="24" data-nav style="width:100%"></div>`);
  const v = await modal({ title: 'Rename squad', body, buttons: [{ label: 'Cancel', value: null, cancel: true }, { label: 'Save', value: 'ok', primary: true }] });
  if (v) { s.name = $('input', body).value.trim() || s.name; Save.dirty(); }
}
async function clubItemActions(uidv, after) {
  const it = Club.get(uidv); if (!it) return;
  const p = P(it.pid);
  const inMk = Club.inMarket(uidv);
  const acts = [];
  if (!inMk && !it.untr) acts.push({ label: 'List on Transfer Market', value: 'list' });
  if (!inMk) acts.push({ label: `Quick sell (${fmtFull(quickSellValue(p))})`, value: 'qs', danger: true });
  const best = bestOwnedForPos(p.pos, uidv);
  if (best) acts.push({ label: 'Compare', value: 'cmp' });
  const v = await inspectCard(p, { item: it, actions: acts });
  if (v === 'qs') {
    if (Club.inSquadAnywhere(uidv) && !(await modal({ title: 'Player is in a squad', body: 'Quick selling removes him from your squads. Continue?', buttons: [{ label: 'Cancel', value: false, cancel: true }, { label: 'Quick sell', value: true, danger: true }] }))) return;
    Club.remove(uidv); Wallet.add('coins', quickSellValue(p), `Quick sold ${p.name}`, 'quicksell'); toast(`Quick sold ${p.name}`, 'good');
  } else if (v === 'list') await listDialog(uidv);
  else if (v === 'cmp') await modal({ title: 'Compare', body: compareHTML(p, best), wide: true });
  after && after();
}
async function listDialog(uidv) {
  const it = Club.get(uidv), p = P(it.pid), rg = Market.priceRange(p), v = Market.value(p);
  const body = h(`<div class="col" style="gap:12px"><div class="row">${playerRowHTML(p)}</div>
    <div class="dim" style="font-size:13px">Estimated market value <b class="good"><i class="coin"></i> ${fmtFull(v)}</b> · allowed range ${fmtFull(rg.min)}–${fmtFull(rg.max)} · 5% tax on sale</div>
    <div class="row"><label class="fld grow">Start price<input type="number" class="st" step="50" value="${Math.round(v * 0.75 / 50) * 50}" data-nav></label><label class="fld grow">Buy Now price<input type="number" class="bn" step="50" value="${Math.round(v * 1.05 / 50) * 50}" data-nav></label></div>
    <label class="fld">Duration<select class="du" data-nav><option value="2">2 minutes</option><option value="10" selected>10 minutes</option><option value="60">1 hour</option><option value="180">3 hours</option></select></label>
    <div class="dim net" style="font-size:13px"></div></div>`);
  const upd = () => $('.net', body).innerHTML = `If sold at Buy Now you receive <b>${fmtFull(Math.round(+$('.bn', body).value * (1 - MARKET_TAX)))}</b> coins.`;
  $('.bn', body).oninput = upd; upd();

  if (r && Market.listItem(uidv, +$('.st', body).value, +$('.bn', body).value, +$('.du', body).value)) { toast(`${p.name} listed`, 'good'); return true; }
  return false;
}

    };

    const swap = (a, b) => { const ua = getU(a), ub = getU(b); setU(a, ub); setU(b, ua); Save.dirty(); Audio2.sfx('select'); };
    const clickSlot = i => {
      if (moving >= 0) { if (moving !== i) swap(moving, i); moving = -1; sel = -1; focusAfter = i; draw(); return; }
      sel = sel === i ? -1 : i; focusAfter = i; draw();

      if (a === 'cancel') { sel = -1; focusAfter = i; draw(); return; }
      if (a === 'view') { await inspectCard(Club.player(u), { item: Club.get(u) }); focusAfter = i; draw(); return; }
      if (a === 'cap') { sq.captain = u; Save.dirty(); toast('Captain set', 'good'); sel = -1; focusAfter = i; draw(); return; }
      if (a === 'remove') { setU(i, null); if (sq.captain === u) sq.captain = null; Save.dirty(); sel = -1; focusAfter = i; draw(); return; }
      if (a === 'move') { moving = i; toast('Now select the slot to swap with'); return; }

        const cur = new Set([...sq.slots, ...sq.subs].filter(Boolean));
        const curPids = new Set([...cur].map(x => Club.get(x)?.pid));
        const pick = await pickPlayer({ title: `Select ${pos && pos !== 'SUB' ? pos : 'player'}`, pos: pos && pos !== 'SUB' ? pos : null, exclude: new Set(), filter: it => !curPids.has(it.pid) || cur.has(it.uid) });
        if (pick) {
          const other = [...sq.slots.map((x, k) => [x, k]), ...sq.subs.map((x, k) => [x, 11 + k])].find(([x]) => x === pick);
          if (other) swap(i, other[1]); else { setU(i, pick); Save.dirty(); Audio2.sfx('select'); }
        }
        sel = -1; focusAfter = i; draw();
      }
    };
    const dnd = (slotEl, i) => {
      const card = $('.card', slotEl);
      card.addEventListener('dragstart', e => { e.dataTransfer.setData('text/slot', String(i)); e.dataTransfer.effectAllowed = 'move'; });
      slotEl.addEventListener('dragover', e => { e.preventDefault(); slotEl.classList.add('drag-over'); });
      slotEl.addEventListener('dragleave', () => slotEl.classList.remove('drag-over'));
      slotEl.addEventListener('drop', e => { e.preventDefault(); slotEl.classList.remove('drag-over'); const from = +e.dataTransfer.getData('text/slot'); if (!isNaN(from) && from !== i) { swap(from, i); sel = -1; draw(); } });
    };
    draw();
    return el;
  }
};

async function buyPack(id) {
  const pk = PACKS[id];
  const opts = [];
  if (pk.coins) opts.push({ label: `${fmtFull(pk.coins)} Coins`, value: 'coins', primary: true });
  if (pk.points) opts.push({ label: `${fmtFull(pk.points)} Prime Points`, value: 'points', primary: !pk.coins });
  opts.push({ label: 'Cancel', value: null, cancel: true });
  const body = h(`<div class="row" style="gap:20px">${packArtHTML(id)}<div><div style="font-weight:800">${pk.desc}</div><div class="dim" style="font-size:13px;margin-top:6px">Odds: ${packOdds(id).slice(0, 4).map(o => `${TIER_LABEL[o.tier]} ${(o.perSlot * 100).toFixed(1)}%`).join(' · ')}…</div><div class="dim" style="font-size:13px;margin-top:6px">Balance: <i class="coin"></i> ${fmtFull(Save.data.coins)} · <i class="pts"></i> ${fmtFull(Save.data.points)}</div></div></div>`);
  const cur = await modal({ title: `Buy ${pk.name}?`, body, buttons: opts });
  if (!cur) return;
  if (Save.data.pending?.length) { toast('Assign your previous pack items first', 'bad'); return UI.go('packresult'); }
  if (!Wallet.spend(cur, cur === 'coins' ? pk.coins : pk.points, `Bought ${pk.name}`, 'store')) return;
  openPack(id, cur === 'coins' || cur === 'points');
}

/* ---------------- PACK OPENING (cinematic) ---------------- */
function openPack(id, tradeable = false) {
  if (Save.data.pending?.length) { // safety: auto-assign leftovers
    Save.data.pending.forEach(x => { if (!x.done) Club.add(x.pid, x.untr, 'pack'); }); Save.data.pending = [];
  }
  const items = generatePack(id);
  const untr = !tradeable || !!PACKS[id].reward;
  Save.data.pending = items.map(p => ({ pid: p.id, untr, done: null }));
  Save.data.stats.packs++; Objectives.track('pack'); XP.add(50);
  Save.now();
  const best = items[0];
  const isWalkout = best.ovr >= 84 || ['icon', 'hero', 'promo', 'totw'].includes(best.type);
  const lvl = best.type === 'icon' ? 4 : best.type === 'hero' || best.type === 'promo' ? 3 : best.ovr >= 86 || best.type === 'totw' ? 2 : best.ovr >= 80 ? 1 : 0;
  Audio2.musicStop();
  const el = h(`<div class="po"><canvas></canvas><div class="stage"></div><button class="btn skip" data-nav>Skip ▸▸</button></div>`);
  document.body.appendChild(el);
  const layer = Input.pushLayer(el, () => finish());
  const cv = $('canvas', el), cx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const colors = { 0: ['#cfd6de', '#7f8a99'], 1: ['#ffd34a', '#c3901c'], 2: ['#ffd34a', '#ff8a00'], 3: ['#ff4fa3', '#7a2ff5'], 4: ['#fff3c4', '#e8b631'] }[lvl];
  let phase = 'pack', t0 = performance.now(), beams = 0, flash = 0, sparks = [], done = false;
  const fx = (now) => {
    if (done) return;
    const t = (now - t0) / 1000;
    cx.fillStyle = '#000'; cx.fillRect(0, 0, W, H);
    // stadium tunnel lights
    const g = cx.createRadialGradient(W / 2, H * 0.55, 10, W / 2, H * 0.55, H);
    g.addColorStop(0, `rgba(40,60,80,${0.5 + beams * 0.3})`); g.addColorStop(1, 'rgba(0,0,0,1)');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    const nb = 6 + lvl * 3;
    for (let i = 0; i < nb; i++) {
      const a = -Math.PI / 2 + (i - nb / 2) * 0.16 + Math.sin(t * 0.8 + i) * 0.05;
      const len = H * 1.2;
      cx.save(); cx.translate(W / 2, H * 1.05); cx.rotate(a + Math.PI / 2);
      const lg = cx.createLinearGradient(0, 0, 0, -len);
      lg.addColorStop(0, colors[i % 2] + 'aa'); lg.addColorStop(1, 'rgba(0,0,0,0)');
      cx.globalAlpha = 0.25 * beams; cx.fillStyle = lg;
      cx.beginPath(); cx.moveTo(-8, 0); cx.lineTo(-90, -len); cx.lineTo(90, -len); cx.lineTo(8, 0); cx.fill(); cx.restore();
    }
    cx.globalAlpha = 1;
    // sparks
    for (const s of sparks) { s.x += s.vx; s.y += s.vy; s.vy += 0.06; s.l -= 0.012; if (s.l > 0) { cx.fillStyle = s.c; cx.globalAlpha = s.l; cx.fillRect(s.x, s.y, 3, 3); } }
    sparks = sparks.filter(s => s.l > 0); cx.globalAlpha = 1;
    if (flash > 0) { cx.fillStyle = `rgba(255,255,255,${flash})`; cx.fillRect(0, 0, W, H); flash -= 0.04; }
    cx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(fx);
  };
  requestAnimationFrame(fx);
  const burst = (n = 160) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = R.range(2, 9); sparks.push({ x: W / 2, y: H * 0.45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, l: 1, c: R.pick(colors) }); } };
  const stage = $('.stage', el);
  const timers = [];
  const at = (ms, f) => timers.push(setTimeout(f, ms));
  stage.innerHTML = `<div class="bigpack">${packArtHTML(id)}</div><div class="dim press" style="font-weight:800">Opening ${PACKS[id].name}…</div>`;
  Audio2.sfx('riser');
  const tweenBeams = (to, ms) => { const from = beams, s = performance.now(); const st = () => { const k = Math.min(1, (performance.now() - s) / ms); beams = from + (to - from) * k; if (k < 1) requestAnimationFrame(st); }; st(); };
  tweenBeams(0.4 + lvl * 0.15, 1400);
  at(1500, () => { $('.bigpack', stage).style.setProperty('--s', '1.4'); $('.bigpack', stage).style.opacity = 0; $('.bigpack', stage).style.transition = 'all .35s'; flash = 0.9; Audio2.sfx('whoosh'); });
  if (isWalkout) {
    const seq = [
      () => `<div class="walk-el">${flagSVG(best.nat, 240, 160)}<div style="font-size:30px;margin-top:10px">${NATIONS[best.nat].name}</div></div>`,
      () => `<div class="walk-el">${best.pos}</div>`,
      () => `<div class="walk-el">${crestSVG(best.club, 200)}<div style="font-size:26px;margin-top:10px">${CLUBS[best.club].name}</div></div>`,
      () => `<div class="walk-el" style="font-size:140px;color:${colors[0]}">${best.ovr}</div>`
    ];
    seq.forEach((f, i) => at(2000 + i * 1300, () => { stage.innerHTML = f(); Audio2.sfx(i === 3 ? 'boom' : 'reveal'); tweenBeams(0.6 + lvl * 0.1 + i * 0.1, 400); if (i === 3) { burst(120); flash = 0.4; } }));
    at(2000 + 4 * 1300, () => reveal());
  } else at(2000, () => reveal());
  function reveal() {
    phase = 'reveal'; flash = 0.7; burst(lvl ? 220 : 60); tweenBeams(1, 300);
    Audio2.sfx(lvl >= 2 ? 'bigreveal' : 'reveal');
    stage.innerHTML = `<div class="reveal-card">${cardHTML(best, { nav: false, cls: 'shine' })}</div><div style="font-weight:900;font-size:20px;text-shadow:0 2px 10px #000">${esc(best.name)} · ${rarityName(best)}</div><button class="btn primary cont" data-nav><span class="key">A</span> Continue</button>`;
    $('.cont', stage).onclick = () => finish();

SCREENS.packresult = {
  bg: 'hub',
  render(params) {
    const { el, body } = subShell('Pack Items', params.packId ? PACKS[params.packId].name : 'Unassigned');
    const pend = Save.data.pending || [];
    const draw = () => {
      const left = pend.filter(x => !x.done);
      body.innerHTML = `<div class="row" style="margin-bottom:10px;gap:10px"><div class="grow dim">${left.length} of ${pend.length} items to assign · Select an item for actions</div>

        <div class="po-grid scroll" style="flex:1">${pend.map((x, i) => { const p = P(x.pid); const dupe = Club.ownsPid(p.id); return `<div class="po-item ${x.done ? 'done' : ''}">${cardHTML(p, { untr: x.untr, extra: dupe && !x.done ? '<div class="c-dupe">DUPLICATE</div>' : '' }).replace('data-pid', `data-i="${i}" data-pid`)}<div class="st ${x.done ? 'dim' : dupe ? 'warn' : 'good'}">${x.done || (dupe ? 'Duplicate' : 'New')}</div></div>`; }).join('')}</div>`;
      $$('.po-grid .card', body).forEach(c => c.onclick = () => itemAct(+c.dataset.i));
      $('.sall', body).onclick = () => { pend.forEach(x => { if (!x.done) { Club.add(x.pid, x.untr, 'pack'); x.done = 'Sent to club'; } }); finishAll(); };
      $('.qsd', body).onclick = () => { let tot = 0; pend.forEach(x => { if (!x.done && Club.ownsPid(x.pid)) { tot += quickSellValue(P(x.pid)); x.done = 'Quick sold'; } }); if (tot) Wallet.add('coins', tot, 'Quick sold pack duplicates', 'quicksell'); Save.dirty(); draw(); if (!pend.some(x => !x.done)) finishAll(); };
    };
    const finishAll = () => { Save.data.pending = []; Save.dirty(); toast('Items assigned', 'good'); UI.go('store', { tab: Save.data.unopened.length ? 'mine' : 'packs' }, { push: false }); };
    const itemAct = async (i) => {
      const x = pend[i]; if (x.done) return;
      const p = P(x.pid);
      const best = bestOwnedForPos(p.pos);
      const acts = [{ label: 'Send to Club', value: 'club', primary: true }, { label: `Quick sell (${fmtFull(quickSellValue(p))})`, value: 'qs', danger: true }];
      if (!x.untr) acts.splice(1, 0, { label: 'List on Transfer Market', value: 'list' });
      if (best) acts.push({ label: `Compare with ${best.ovr} ${shortName(best.name)}`, value: 'cmp' });
      const v = await inspectCard(p, { item: { untr: x.untr }, actions: acts });
      if (v === 'club') { Club.add(p.id, x.untr, 'pack'); x.done = 'Sent to club'; }
      else if (v === 'qs') { Wallet.add('coins', quickSellValue(p), `Quick sold ${p.name}`, 'quicksell'); x.done = 'Quick sold'; }
      else if (v === 'list') { const it = Club.add(p.id, x.untr, 'pack'); if (await listDialog(it.uid)) x.done = 'Listed'; else x.done = 'Sent to club'; }
      else if (v === 'cmp') { await modal({ title: 'Compare', body: compareHTML(p, best), wide: true }); }
      Save.dirty();
      if (!pend.some(y => !y.done)) return finishAll();
      draw();
    };
    if (!pend.length) body.innerHTML = '<div class="dim">No pending items.</div>';
    else draw();
    return el;
  },
  back() { const pend = Save.data.pending || []; pend.forEach(x => { if (!x.done) Club.add(x.pid, x.untr, 'pack'); }); Save.data.pending = []; Save.dirty(); UI.go('store', {}, { push: false }); }
};

      $('.clr', body).onclick = () => { st.uids = st.uids.map(() => null); persist(); draw(); };
      $('.fill', body).onclick = () => { autoFill(); persist(); draw(); };
      $('.sub', body).onclick = async () => {
        const vals = ps.filter(Boolean).reduce((s, p) => s + Market.value(p), 0);
        if (await modal({ title: 'Submit SBC?', body: `${sbc.size} players (est. value ${fmtFull(vals)} coins) will be exchanged for: <b>${rewardText(sbc.reward)}</b>`, buttons: [{ label: 'Cancel', value: false, cancel: true }, { label: 'Submit', value: true, primary: true }] })) {
          if (SBC.submit(sbc, st.uids, st.formation)) { Audio2.sfx('bigreveal'); if (Save.data.sbc.draft) delete Save.data.sbc.draft[sbc.id]; toast(`SBC complete! ${rewardText(sbc.reward)}`, 'good'); UI.go('sbc', { cat: params.cat }, { push: false }); UI.stack = []; }
        }
      };
      if (focusIdx != null) $(`.slot[data-slot="${focusIdx}"] .card`, body)?.focus();
    };
    const pickSlot = async (i) => {
      const used = new Set(st.uids.filter(Boolean));
      const usedPids = new Set([...used].map(u => Club.get(u).pid));
      if (st.uids[i]) {
        const v = await modal({ title: 'Slot', body: playerRowHTML(Club.player(st.uids[i])), buttons: [{ label: 'Replace', value: 'r', primary: true }, { label: 'Remove', value: 'x' }, { label: 'Cancel', value: null, cancel: true }] });
        if (v === 'x') { st.uids[i] = null; persist(); return draw(i); }
        if (v !== 'r') return draw(i);
      }
      const pos = sbc.size === 11 ? FORMATIONS[st.formation][i][0] : null;
      const u = await pickPlayer({ title: `Select player${pos ? ' · ' + pos : ''}`, pos, exclude: used, filter: it => !usedPids.has(it.pid) });
      if (u) { st.uids[i] = u; persist(); Audio2.sfx('select'); }
      draw(i);
    };
    // greedy auto-fill: lowest-value players that fit the requirements; prefers non-squad players
    const autoFill = () => {
      const allTier = sbc.reqs.find(r => r.t === 'tierAll');
      const minRat = sbc.reqs.find(r => r.t === 'rating')?.v || 0;
      const used = new Set(st.uids.filter(Boolean)), usedPids = new Set([...used].map(u => Club.get(u).pid));
      let pool = Save.data.club.items.filter(it => !used.has(it.uid) && !Club.inMarket(it.uid) && !usedPids.has(it.pid)).map(it => ({ it, p: P(it.pid) }));
      if (allTier) pool = pool.filter(x => tierOf(x.p.ovr) === allTier.v && x.p.type === 'base');
      const sameLg = sbc.reqs.find(r => r.t === 'sameLeague');
      if (sameLg) { const cnt = {}; pool.forEach(x => cnt[x.p.lg] = (cnt[x.p.lg] || 0) + 1); const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0]?.[0]; pool = pool.filter(x => x.p.lg === best); }
      pool.sort((a, b) => (Club.inSquadAnywhere(a.it.uid) - Club.inSquadAnywhere(b.it.uid)) || (Math.abs(a.p.ovr - minRat) - Math.abs(b.p.ovr - minRat)));
      st.uids = st.uids.map((u, i) => {
        if (u) return u;
        const pos = sbc.size === 11 ? FORMATIONS[st.formation][i][0] : null;
        let k = pool.findIndex(x => (!pos || playerFitsPos(x.p, pos)) && !usedPids.has(x.p.id));
        if (k < 0) k = pool.findIndex(x => !usedPids.has(x.p.id) && (!pos || (pos === 'GK') === (x.p.pos === 'GK')));
        if (k < 0) return null;
        const x = pool.splice(k, 1)[0]; usedPids.add(x.p.id); return x.it.uid;
      });
      Audio2.sfx('select');
    };
    draw();
    return el;
  }
};

async function bidDialog(l) {

}

function requireSquad() {
  const sq = Squads.active();
  if (!Squads.isComplete(sq)) { modal({ title: 'Squad incomplete', body: 'Your active squad needs 11 players before you can play. Use Auto-build in the Squad Builder.', buttons: [{ label: 'Open Squad Builder', value: true, primary: true }, { label: 'Cancel', value: false, cancel: true }] }).then(v => v && UI.go('squad')); return false; }
  return true;
}
function userTeam(useAway = false) {
  const sq = Squads.active(), pr = Save.data.profile;
  const players = Squads.players(sq), subs = sq.subs.map(u => u ? Club.player(u) : null).filter(Boolean);
  return { name: pr.clubName, short: pr.clubName.slice(0, 3).toUpperCase(), kit: useAway ? pr.kit.away : pr.kit.home, formation: sq.formation, players, subs, badge: pr.badge, chem: Squads.info(sq).chem, isUser: true };
}
function aiTeam(name, strength, kit) {
  const s = buildAISquad(strength);
  const k = kit || { c1: R.pick(['#c8102e', '#034694', '#ffffff', '#111111', '#00954c', '#6b2ea6', '#ff7f00', '#12a0d7']), c2: R.pick(['#ffffff', '#111111', '#ffd23f']) };
  return { name, short: name.replace(/[^A-Z]/g, '').slice(0, 3) || name.slice(0, 3).toUpperCase(), kit: k, formation: s.formation, players: s.players, subs: s.subs };
}
function kitClash(a, b) { const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const x = hex(a), y = hex(b); return Math.hypot(x[0] - y[0], x[1] - y[1], x[2] - y[2]) < 120; }

/* match result bookkeeping for UT modes */
function recordUTMatch(res, mode) {
  const st = Save.data.stats, u = res.userSide === 'away' ? 'away' : 'home';
  const gf = u === 'home' ? res.hg : res.ag, ga = u === 'home' ? res.ag : res.hg;
  const r = gf > ga ? 'W' : gf < ga ? 'L' : (res.pens ? (res.winner === u ? 'W' : 'L') : 'D');
  st.played++; st.gf += gf; st.ga += ga; if (r === 'W') st.wins++; else if (r === 'L') st.losses++; else st.draws++;
  Objectives.track('match');
  if (gf) Objectives.track('goal', gf);
  if (r === 'W') Objectives.track('win');
  if (ga === 0) Objectives.track('cleansheet');
  const myGoals = res.goals.filter(g => g.side === u && !g.og);
  const assists = myGoals.filter(g => g.assist).length; if (assists) { Objectives.track('assist', assists); st.assists += assists; }
  if (myGoals.some(g => POS_GROUP[g.pos] === 'MID')) Objectives.track('goal_mid');
  XP.add(r === 'W' ? 300 : r === 'D' ? 180 : 120);
  return r;
}
function logMatch(res, mode, r) {
  Save.data.matches.unshift({ t: Date.now(), mode, home: res.home.name, away: res.away.name, hg: res.hg, ag: res.ag, res: r });
  if (Save.data.matches.length > 100) Save.data.matches.length = 100;
  Save.dirty();
}
function league3Check(team) {
  const c = {}; team.players.forEach(p => { if (p) c[p.lg] = (c[p.lg] || 0) + 1; });
  if (Object.values(c).some(n => n >= 3)) Objectives.track('league3');
}

/* fast statistical simulation using team strengths */
function simulateMatch(cfg) {
  const H = teamStrength(cfg.home.formation, cfg.home.players, cfg.home.chem), A = teamStrength(cfg.away.formation, cfg.away.players, cfg.away.chem);
  const hs = (H.att * 0.4 + H.mid * 0.35 + H.def * 0.25), as = (A.att * 0.4 + A.mid * 0.35 + A.def * 0.25);
  let [hg, ag] = simScore(hs, as, cfg.userSide ? 1 : 1.5);
  const goals = [];
  const pickScorer = (team) => { const w = team.players.map((p, i) => ({ w: { ATT: 6, MID: 3, DEF: 1, GK: 0.02 }[POS_GROUP[FORMATIONS[team.formation][i][0]]] * (p.stats[1] / 60), v: p })); return R.weighted(w); };
  const add = (side, n) => { for (let i = 0; i < n; i++) { const t = side === 'home' ? cfg.home : cfg.away; const p = pickScorer(t), as2 = R.chance(0.7) ? R.pick(t.players.filter(x => x !== p)) : null; goals.push({ side, pid: p.id, name: p.name, pos: p.pos, min: R.int(1, 90), assist: as2 ? as2.name : null }); } };
  add('home', hg); add('away', ag); goals.sort((a, b) => a.min - b.min);
  let winner = hg > ag ? 'home' : ag > hg ? 'away' : null, pens = null;
  if (!winner && cfg.knockout) { const a = R.int(3, 5), b = a === 5 ? 4 : R.int(2, 5); pens = R.chance(0.5 + (hs - as) / 60) ? [Math.max(a, b + 1), b] : [b, Math.max(a, b + 1)]; winner = pens[0] > pens[1] ? 'home' : 'away'; }
  const poss = clamp(Math.round(50 + (H.mid - A.mid) * 1.2 + R.range(-5, 5)), 30, 70);
  const shotsH = R.int(4, 9) + hg * 2, shotsA = R.int(4, 9) + ag * 2;
  const stats = { poss: [poss, 100 - poss], shots: [shotsH, shotsA], sot: [hg + R.int(1, 3), ag + R.int(1, 3)], passes: [R.int(300, 520), R.int(300, 520)], tackles: [R.int(8, 20), R.int(8, 20)], fouls: [R.int(4, 12), R.int(4, 12)], corners: [R.int(1, 8), R.int(1, 8)] };
  return { home: cfg.home, away: cfg.away, hg, ag, goals, stats, winner, pens, userSide: cfg.userSide, simulated: true, mode: cfg.mode };
}

/* ---- match/engine.js ---- */
/* ============================================================
   MATCH / ENGINE — 11v11 football simulation
   Pitch 105×68 m. Ball physics with height, possession & dribbling,
   passes/through/lobs/crosses/shots/finesse/headers/volleys, tackles,
   slides, fouls, set pieces (kick-off, throw-in, corner, goal kick,
   free kick, penalty), goalkeeping, stamina, subs, team & player AI.
   ============================================================ */
const PW = 105, PH = 68, GOAL_W = 7.32, GOAL_H = 2.44, G = 9.81;
const GY0 = PH / 2 - GOAL_W / 2, GY1 = PH / 2 + GOAL_W / 2;

const Match = {
  active: false, s: null,
  start(cfg, onEnd) {
    Audio2.musicStop(); Audio2.crowdStart();
    const root = $('#match'); root.classList.remove('hidden'); root.innerHTML = '';
    BG.set('off'); $('#screen').style.visibility = 'hidden';
    const s = this.s = newMatchState(cfg);
    s.onEnd = onEnd;
    MatchView.init(root, s);
    Input.mode = 'game'; Input.clearPressed();
    this.active = true;
    this.layer = Input.pushLayer(root, () => { });
    let last = performance.now(), acc = 0;
    const step = 1 / 60;
    const loop = (now) => {
      if (!this.active) return;
      acc += clamp((now - last) / 1000, 0, 0.1); last = now;
      readGameInput(s);
      while (acc >= step) { if (!s.paused) update(s, step); acc -= step; }
      MatchView.draw(s);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    beginKickoff(s, 'home');
    banner(s, `${s.teams.home.short} vs ${s.teams.away.short}`, cfg.title || 'Kick-off', 1.8);
  },
  end() {
    const s = this.s; this.active = false;
    Audio2.crowdStop(); Input.popLayer(this.layer);
    $('#match').classList.add('hidden'); $('#match').innerHTML = ''; $('#screen').style.visibility = '';
    Input.mode = 'menu';
    const res = buildResult(s);
    s.onEnd(res);
  }
};

function newMatchState(cfg) {
  const ai = DIFFICULTIES[cfg.difficulty || 'professional'].ai;
  const s = {
    cfg, t: 0, clock: 0, half: 1, halfSecs: (cfg.halfLen || 3) * 60, state: 'kickoff', stateT: 0, paused: false,
    rules: cfg.rules || 'classic', ai, userSide: cfg.userSide, msgs: [], banner: null,
    ball: { x: PW / 2, y: PH / 2, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, owner: null, last: null, prev: null, shot: null, shotEval: false, kickType: '' },
    stats: { poss: [0, 0], shots: [0, 0], sot: [0, 0], passes: [0, 0], tackles: [0, 0], fouls: [0, 0], corners: [0, 0] },
    goals: [], score: { home: 0, away: 0 }, subsUsed: { home: 0, away: 0 }, sp: null, cam: { x: PW / 2, y: PH / 2, zoom: 1 },
    ctrl: null, charge: 0, chargeKind: null, fx: [], ref: { x: PW / 2, y: PH / 2 + 8, vx: 0, vy: 0, ph: 0 }, goldenGoal: false, extra: false
  };
  s.teams = {};
  for (const side of ['home', 'away']) {
    const T = cfg[side];
    const team = s.teams[side] = { side, name: T.name, short: T.short, kit: T.kit, formation: T.formation, dir: side === 'home' ? 1 : -1, players: [], bench: (T.subs || []).slice(0, 7), user: s.userSide === side, chem: T.chem };
    T.players.forEach((p, i) => team.players.push(makeMP(p, side, i, team, T.chem ? T.chem.per[i] : 3)));
  }
  s.all = [...s.teams.home.players, ...s.teams.away.players];
  if (s.userSide) s.ctrl = s.teams[s.userSide].players.find(p => p.slotPos === 'ST' || p.slotPos === 'CF') || s.teams[s.userSide].players[10];
  return s;
}
function makeMP(p, side, slot, team, chem) {
  const pos = FORMATIONS[team.formation][slot];
  const st = p.stats, gk = pos[0] === 'GK';
  const fit = playerFitsPos(p, pos[0]) ? 0 : -6;
  const cb = (chem - 1.5) * 1.5 + fit; // chemistry & position fit tweak effective attributes
  const a = i => clamp(st[i] + cb, 20, 99);
  return {
    p, side, slot, team, slotPos: pos[0], fx: pos[1], fy: pos[2], gk,
    x: 0, y: 0, vx: 0, vy: 0, face: side === 'home' ? 0 : Math.PI,
    pac: gk ? 55 : a(0), sho: gk ? 30 : a(1), pas: gk ? Math.max(50, st[2]) : a(2), dri: gk ? 40 : a(3), def: gk ? 40 : a(4), phy: gk ? 60 : a(5),
    gkr: gk ? clamp(p.ovr + cb, 30, 99) : 0,
    stamina: 1, cool: 0, tackleCool: 0, stun: 0, dive: null, decideT: Math.random() * 0.5, run: null, ph: Math.random() * 6, skillT: 0, yellow: 0, label: null, labelT: 0, goalT: 0
  };
}
function enemy(s, side) { return s.teams[side === 'home' ? 'away' : 'home']; }
function other(side) { return side === 'home' ? 'away' : 'home'; }
function goalX(team) { return team.dir > 0 ? PW : 0; }   // goal this team attacks
function ownGoalX(team) { return team.dir > 0 ? 0 : PW; }
function sideIdx(side) { return side === 'home' ? 0 : 1; }
function msg(s, text, dur = 2) { s.msgs.push({ text, t: dur }); }
function banner(s, big, small = '', dur = 2.2) { s.banner = { big, small, t: dur }; }
function maxSpeed(m, sprint) {
  const base = 5.2 + m.pac / 100 * 3.6;
  let v = sprint ? base : base * 0.66;
  v *= 0.72 + 0.28 * m.stamina;
  if (m.side !== m.team.side) v *= 1;
  if (!m.team.user) v *= 0.93 + m.team._ai * 0.09;
  return v;
}

/* ------------------------- positioning ------------------------- */
function homeSpot(s, m) {
  const t = m.team, b = s.ball;
  const inPoss = b.owner && b.owner.side === m.side;
  const depth = (100 - m.fy) / 100;
  const span = inPoss ? 70 : 52;
  // block shift: how far up the pitch the ball is, from this team's perspective
  const prog = t.dir > 0 ? b.x : PW - b.x;
  const shift = clamp((prog - 52.5) * 0.45 + (inPoss ? 10 : -2), -14, 28);
  let along = 4 + depth * span + (m.gk ? -shift : shift);
  if (!m.gk && !inPoss) along = Math.max(along, POS_GROUP[m.slotPos] === 'DEF' ? 7 : 11);
  if (m.gk) along = clamp(3 + Math.max(0, prog - 60) * 0.06, 2, 9);
  along = clamp(along, 2, 100);
  const width = (inPoss ? 30 : 23);
  let y = PH / 2 + (t.dir > 0 ? 1 : -1) * ((m.fx - 50) / 50) * width;
  y += (b.y - PH / 2) * (m.gk ? 0.08 : 0.22);
  const x = t.dir > 0 ? along : PW - along;
  return { x: clamp(x, 1, PW - 1), y: clamp(y, 2, PH - 2) };
}
function nearestTo(list, x, y, excl) {
  let best = null, bd = 1e9;
  for (const m of list) { if (m === excl || m.stun > 0) continue; const d = (m.x - x) ** 2 + (m.y - y) ** 2; if (d < bd) { bd = d; best = m; } }
  return best;
}
function placeFormation(s, kickSide) {
  for (const side of ['home', 'away']) {
    const t = s.teams[side];
    for (const m of t.players) {
      const depth = (100 - m.fy) / 100;
      let along = 3 + depth * 46; along = Math.min(along, 50.5);
      if (m.gk) along = 3;
      m.x = t.dir > 0 ? along : PW - along;
      m.y = clamp(PH / 2 + (t.dir > 0 ? 1 : -1) * ((m.fx - 50) / 50) * 26, 3, PH - 3);
      m.vx = m.vy = 0; m.dive = null; m.stun = 0; m.run = null;
      m.face = t.dir > 0 ? 0 : Math.PI;
    }
  }
  // kicker + partner at centre

    const body = h('<div></div>');
    const draw = () => {
      body.innerHTML = `<div class="dim" style="margin-bottom:8px">Substitutions used: ${s.subsUsed[s.userSide]}/5. Select a player on the pitch, then a substitute.</div>
        <div class="row" style="gap:20px;align-items:flex-start"><div class="col" style="gap:4px;flex:1">${team.players.map((m, i) => `<button class="prow" data-nav data-on="${i}" style="${selOn === i ? 'border-color:var(--teal)' : ''}"><span style="width:38px;font-weight:900">${m.slotPos}</span><span class="grow">${esc(m.p.name)} (${m.p.ovr})</span><span style="width:60px"><span class="bar" style="display:block"><i style="width:${m.stamina * 100}%;background:${m.stamina > 0.6 ? 'var(--green)' : m.stamina > 0.3 ? 'var(--yellow)' : 'var(--red)'}"></i></span></span></button>`).join('')}</div>
        <div class="col" style="gap:4px;flex:1">${team.bench.map((p, i) => `<button class="prow" data-nav data-b="${i}" ${selOn === null || s.subsUsed[s.userSide] >= 5 ? 'disabled style="opacity:.5"' : ''}><span style="width:38px;font-weight:900">${p.pos}</span><span class="grow">${esc(p.name)} (${p.ovr})</span></button>`).join('') || '<div class="dim">No substitutes available</div>'}</div></div>`;
      $$('[data-on]', body).forEach(b => b.onclick = () => { selOn = +b.dataset.on; draw(); $(`[data-b]`, body)?.focus(); });
      $$('[data-b]', body).forEach(b => b.onclick = () => {
        if (selOn === null || s.subsUsed[s.userSide] >= 5) return;
        const old = team.players[selOn], np = team.bench[+b.dataset.b];
        const nm = makeMP(np, old.side, old.slot, team, team.chem ? team.chem.per[old.slot] : 2);
        Object.assign(nm, { x: old.x, y: old.y, face: old.face });
        team.players[selOn] = nm; s.all = [...s.teams.home.players, ...s.teams.away.players];
        team.bench.splice(+b.dataset.b, 1, old.p);
        if (s.ball.owner === old) s.ball.owner = nm;
        if (s.ctrl === old) s.ctrl = nm;
        s.subsUsed[s.userSide]++; msg(s, `🔁 ${shortName(np.name)} on for ${shortName(old.p.name)}`, 2.5);
        selOn = null; draw();
      });
    };
    draw();
    modal({ title: 'Substitutions', body, wide: true, buttons: [{ label: 'Done', value: true, primary: true, cancel: true }] });
  }
};
function simulateRest(s) {
  const remain = s.half === 1 ? 1 + (1 - s.clock / s.halfSecs) : Math.max(0, 1 - s.clock / s.halfSecs);
  const frac = remain / 2;
  const H = teamStrength(s.teams.home.formation, s.teams.home.players.map(m => m.p)), A = teamStrength(s.teams.away.formation, s.teams.away.players.map(m => m.p));
  const hs = H.att * 0.4 + H.mid * 0.35 + H.def * 0.25, as = A.att * 0.4 + A.mid * 0.35 + A.def * 0.25;
  const pois = l => { let L = Math.exp(-l), k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; };
  const diff = (hs - as) / 10;
  const hg = pois(clamp(1.35 + diff * 0.9, 0.2, 4) * frac), ag = pois(clamp(1.15 - diff * 0.9, 0.2, 4) * frac);
  const baseMin = Math.floor((s.half - 1) * 45 + s.clock / s.halfSecs * 45);
  const add = (side, n) => { const t = s.teams[side]; for (let i = 0; i < n; i++) { const m = R.weighted(t.players.map(x => ({ w: { ATT: 6, MID: 3, DEF: 1, GK: 0.01 }[POS_GROUP[x.slotPos]], v: x }))); s.goals.push({ side, pid: m.p.id, name: m.p.name, pos: m.slotPos, min: R.int(baseMin + 1, 90), assist: null }); s.score[side]++; } };
  add('home', hg); add('away', ag);
  s.goals.sort((a, b) => a.min - b.min);
  s.stats.shots[0] += hg * 2 + R.int(0, 3); s.stats.shots[1] += ag * 2 + R.int(0, 3); s.stats.sot[0] += hg; s.stats.sot[1] += ag;
  Match.end();
}

})();
